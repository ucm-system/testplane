# TestPlane infra · 本地 ChartMuseum 兼容仓库（只服务 Genet 的 Helm 管理功能）
#
# 为什么需要它：Genet 的 chartRepo 只支持两类：
#   - harbor-oci：要走 Harbor 的 artifacts API（/api/v2.0/...），普通 registry:2 不行；
#   - harbor-chartmuseum：形如 GET /api/chartrepo/<project>/charts[/name[/version]]
#                          与 GET /chartrepo/<project>/charts/<name>-<version>.tgz。
# 后者可以用**静态 nginx** 假冒（本文件就是），够我们装 deploy/charts/mock-llm。
#
# 用法：pwsh deploy/genet-local/build-chartrepo.ps1   （打包 chart + 生成清单 + apply）
#
# 注意：这是**联调用的最小实现**，不做鉴权、不做上传、不做多 chart 索引；
# 只把 mock-llm 一个 chart 摊成 Genet 期待的几个静态路径。
apiVersion: v1
kind: ConfigMap
metadata:
  name: genet-chartrepo
  namespace: genet
data:
  nginx.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      location / { }
      # 无扩展名的 JSON 文件要显式给类型（Genet 按 json 解析）
      location ^~ /api/ { default_type application/json; }
    }
  # GET /api/chartrepo/charts/charts → chart 列表（数组形态）
  charts: |
    [
      {
        "name": "mock-llm",
        "version": "0.1.0",
        "appVersion": "dev",
        "description": "mock LLM service for TestPlane e2e",
        "urls": ["chartrepo/charts/charts/mock-llm-0.1.0.tgz"]
      }
    ]
# chart tgz 由 build-chartrepo.ps1 用 `helm package` 现打，再替换下面的占位符写入。
# 版本号变了要同步改这里的 key 与 charts 里的 version/urls。
binaryData:
  mock-llm-0.1.0.tgz: "__CHART_TGZ_BASE64__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genet-chartrepo
  namespace: genet
  labels:
    app: genet-chartrepo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genet-chartrepo
  template:
    metadata:
      labels:
        app: genet-chartrepo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /api/chartrepo/charts/charts
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            # 配置文件按 subPath 覆盖默认站点
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            # 静态文件：ConfigMap 的 key → 目标路径（无扩展名，靠 nginx 的 default_type）
            - name: html
              mountPath: /usr/share/nginx/html/api/chartrepo/charts/charts
              subPath: charts
            - name: html
              mountPath: /usr/share/nginx/html/chartrepo/charts/charts/mock-llm-0.1.0.tgz
              subPath: mock-llm-0.1.0.tgz
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      volumes:
        - name: conf
          configMap:
            name: genet-chartrepo
            items:
              - { key: nginx.conf, path: nginx.conf }
        - name: html
          configMap:
            name: genet-chartrepo
            items:
              # 二进制（chart tgz）走 binaryData
              - { key: mock-llm-0.1.0.tgz, path: mock-llm-0.1.0.tgz }
              - { key: charts, path: charts }
---
apiVersion: v1
kind: Service
metadata:
  name: genet-chartrepo
  namespace: genet
  labels:
    app: genet-chartrepo
spec:
  type: ClusterIP
  selector:
    app: genet-chartrepo
  ports:
    - name: http
      port: 80
      targetPort: http
