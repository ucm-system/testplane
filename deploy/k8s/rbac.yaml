# Argus · RBAC（最小集）
#
# 设计依据
#   design/views/06-physical-view.md §2（对象清单）、§4.4（平台不授予的权限）
#   design/impl/web-and-delivery.md §9「RBAC（最小集）」表
#
# 两层结构（W-9）：
#   1) Role argus          —— namespace 级，执行层要写的东西（Job/Pod/Lease…）
#   2) ClusterRole argus-view —— 集群级只读，看板与 waiting_reason 的数据源
#
# 刻意**不授予**（06 §4.4，任何一条都不要"顺手补上"）：
#   secrets get/list/watch     日志明文不脱敏（K-5），凭据只由 kubelet 注入
#                              —— 唯一例外是 D-55 的 rotate 窄授权，**不写在本文件**：
#                              用 deploy/k8s/gen-secret-rotate-role.ps1 按登记项生成
#                              （resourceNames 限定到那一条 Secret，只授 get，见 rbac-secret-rotate.yaml）。
#                              ⚠️ **这是 apply 完本文件之后的硬步骤**：漏了它，
#                              `POST /admin/secrets/{name}/rotate` 会一直 503（缺 secrets get）。
#                              生成脚本的 -ServiceAccount 必填，两种安装方式名字不同
#                              （kustomize=argus，Helm=<release>-argus）。
#                              步骤见 deploy/README.md §6.1 与 kustomization.yaml 顶部注释。
#   pods/exec、attach、portforward  平台不代执行命令
#   deployments/services/ingresses  部署归 Genet，平台只建 Job
#   nodes 写 / drain / evict    只读可见性，不替运维做节点决策
#   volcano 写（权重、抢占、删 PodGroup）  平台没有调度决策权
#
# 作用域说明：控制面与 Runner Job 同处 namespace `argus`
# （AG_EXECUTOR_NAMESPACE），所以 namespace 级 Role 足够。
# 若将来 Job 要落到**其它** namespace，用 deploy/k8s/rbac-cluster-executor.yaml
# 里的 ClusterRole 变体替换本文件的 Role/RoleBinding——那是更大的权限面，需评审。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argus
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/part-of: argus
rules:
  # 创建 / 跟踪 / 取消 Task Job（E-2、E-5.2）
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # 状态对账（E-4）、按 label 发现 Deploy Pod、取消时兜底删 Pod（E-5.2）
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # 日志采集 follow（E-7）
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # 渲染期校验 Profile 挂载的 PVC 是否存在（E-3.4）
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  # 复核 Pod 的 FailedMount / FailedScheduling（E-4.4）
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # 选主：controller / collector leader（E-7.3）
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argus
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/part-of: argus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argus
subjects:
  - kind: ServiceAccount
    name: argus
    namespace: argus
---
# 集群级**只读**：看板节点状态（`insufficient_resources` 判定的数据源）。
# Volcano 相关权限单独拆到下面的 argus-volcano-view —— 见 design/views/06 §2.1。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-view
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/part-of: argus
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argus-view
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/part-of: argus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argus-view
subjects:
  - kind: ServiceAccount
    name: argus
    namespace: argus
---
# Volcano 队列快照（E-11、design/views/06 §2.1）：`queues` 与 `podgroups` 都是
# **cluster-scoped**，上面的 namespace 级 Role 绑不到，所以必须 ClusterRole。
#
# 只给 get/list，**不给 watch**：实现是"轮询 + 15s TTL + 单飞"，不用 informer；
# 给 watch 等于允许无限长连接，只扩大权限面（而且看板量级 < 50 队列，watch 没有收益）。
# 不授 `queues/status` / `podgroups/status` 的写权限：读 status 随主资源 get/list 一起返回，
# 不需要额外的 subresource 规则。也**不授 secrets、不授 pods/exec**（06 §4.4）。
#
# Volcano 未安装时不报错：ClusterRole 只声明 apiGroups/resources，**不做 discovery**，
# 集群里没有这些 CRD 也能 apply。真无权限时是 List 阶段 IsForbidden → 降级 rbac_forbidden。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argus-volcano-view
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/part-of: argus
rules:
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["queues", "podgroups"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argus-volcano-view
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/part-of: argus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argus-volcano-view
subjects:
  - kind: ServiceAccount
    name: argus
    namespace: argus
