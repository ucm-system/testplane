# Argus · 控制面 ServiceAccount
#
# 只有控制面需要 token：它要创建/观测 Job、读 Pod 日志、抢 Lease。
# Runner Pod 一律 automountServiceAccountToken: false（design/impl/execution.md §2.1），
# 所以 Runner 不需要、也拿不到任何 SA。
#
# automountServiceAccountToken 显式写 true：与 Runner 的 false 成对出现，
# 避免有人以为「默认挂载」是平台依赖。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argus
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/part-of: argus
automountServiceAccountToken: true
