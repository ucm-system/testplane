# TestPlane · 控制面 ServiceAccount
#
# 只有控制面需要 token：它要创建/观测 Job、读 Pod 日志、抢 Lease。
# Tester Pod 一律 automountServiceAccountToken: false（design/impl/execution.md §2.1），
# 所以 Tester 不需要、也拿不到任何 SA。
#
# automountServiceAccountToken 显式写 true：与 Tester 的 false 成对出现，
# 避免有人以为「默认挂载」是平台依赖。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testplane
  namespace: testplane
  labels:
    app.kubernetes.io/name: testplane
    app.kubernetes.io/part-of: testplane
automountServiceAccountToken: true
