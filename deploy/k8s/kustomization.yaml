# Argus · 基础设施层 kustomization（不含控制面）
#
# 只搭环境：namespace / SA / RBAC / PV+PVC / ConfigMap / 被测服务 namespace。
# 应用：kubectl apply -k deploy/k8s
# 预览：kubectl kustomize deploy/k8s
# 删除：kubectl delete -k deploy/k8s
#
# 控制面不在这里 —— 它要的镜像 `argus-server:dev` 必须先 docker build + kind load
# 才能跑，所以放在 kustomize Component 里按需叠加：
#   kubectl apply -k deploy/overlays/with-control-plane
# 对应文件：deploy/components/control-plane/{deployment,migrate-job}.yaml
#
# 另外几份「有前提条件」的清单仍然单独 apply（各自文件头写了原因）：
#   k8s/rbac-cluster-executor.yaml  Job 要落到 argus 以外的 namespace 时（扩权，需评审）
#   k8s/rbac-secret-rotate.yaml     D-55 窄授权（rotate 用）。
#                                   ⚠️ **apply 完 base 之后的硬步骤，不是可选项**：不 apply，
#                                   `POST /admin/secrets/{name}/rotate` 会因缺 get 权限一直 503。
#                                   按登记项生成（-ServiceAccount 必填，见脚本）：
#                                     pwsh deploy/k8s/gen-secret-rotate-role.ps1 -Namespace argus `
#                                       -SecretName <secret_refs.secret_name> -ServiceAccount argus `
#                                       -Out deploy/k8s/rbac-secret-rotate.yaml
#                                     kubectl -n argus apply -f deploy/k8s/rbac-secret-rotate.yaml
#                                   约束：resourceNames 必须等于 secret_refs.secret_name；RoleBinding 的
#                                   subject 必须等于控制面实际 SA 名（kustomize=argus，Helm=<release>-argus）。
#                                   **不要**把 secrets 权限并进 rbac.yaml（那会变成通配授权）。
#                                   完整步骤 + 两种安装方式的示例命令见 deploy/README.md §6.1。
#   k8s/networkpolicy.yaml          有真 CNI 时；kindnet 不实现 NetworkPolicy
#   k8s/pdb.yaml                    单副本 + minAvailable:1 会阻塞 drain，dev 不需要
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - storage.yaml
  - configmap.yaml
  # 被测服务（Genet 装的服务 / mock-llm chart）专用 namespace + 网络边界
  - mock-namespace.yaml
