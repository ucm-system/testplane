# Argus · NetworkPolicy（**默认不启用，opt-in**）
#
# 依据 design/views/06-physical-view.md §4（网络与安全边界）。
#
# ⚠️ 两个 dev 事实，先读再启用：
#   1) kind 的默认 CNI（kindnet）**不实现 NetworkPolicy**——清单能 apply，但不生效。
#      要真生效得换 Calico/Cilium 之类的 CNI，那是 dev 集群的事，不在本清单里做。
#   2) dev 的 PostgreSQL 与镜像仓库都在宿主/公网，逐条放行的 egress 会挡住它们。
#      下面给的是**能跑通的 dev 版放行集**，与 06 §4.2 的生产放行集不同。
#
# 启用：
#   kubectl apply -f deploy/k8s/networkpolicy.yaml
# 单纯直连调试（port-forward、临时 Pod）时别开，会把自己挡掉。
#
# 生产放行集（06 §4.2）在生产 CNI 上重写：DNS 53、PostgreSQL 5432、
# Genet 443、OIDC 443、NFS 2049、镜像仓库，其余全拒。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argus-default-deny
  namespace: argus
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/part-of: argus
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 控制面：放行入站 8080（Ingress/Prometheus/临时 port-forward 调试用）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argusd-allow-ingress-8080
  namespace: argus
  labels:
    app.kubernetes.io/name: argusd
    app.kubernetes.io/part-of: argus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argusd
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
---
# 控制面出站：DNS、PG、K8s API、Genet/OIDC（443）、NFS（真 RWX 时才有）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argusd-allow-egress
  namespace: argus
  labels:
    app.kubernetes.io/name: argusd
    app.kubernetes.io/part-of: argus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argusd
  policyTypes:
    - Egress
  egress:
    # kube-dns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # K8s API（in-cluster 走 Service，只需 443）
    - ports:
        - port: 443
          protocol: TCP
    # PostgreSQL（dev 在宿主，宿主 IP 不固定 → dev 版放宽到任意目标 5432）
    - ports:
        - port: 5432
          protocol: TCP
    # NFS（dev 用 hostPath 时没有这跳；换 NFS CSI 后保留 2049）
    - ports:
        - port: 2049
          protocol: TCP
---
# Runner Pod 出站：DNS + 被测服务（06 §4.3）。
# 平台会**按 Job 再渲染一条**同名策略（E-2.1），这里给的是手工跑冒烟用的兜底。
# 生产要把它收紧到 Execution Profile 的 egress_allow 网段，本文件不替代执行层渲染。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tester-allow-egress
  namespace: argus
  labels:
    app.kubernetes.io/name: tester
    app.kubernetes.io/part-of: argus
spec:
  podSelector:
    matchLabels:
      argus.io/managed: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # dev 默认放行被测服务（生产收紧为 egress_allow 网段）
    - ports:
        - port: 80
          protocol: TCP
        - port: 8000
          protocol: TCP
        - port: 443
          protocol: TCP
