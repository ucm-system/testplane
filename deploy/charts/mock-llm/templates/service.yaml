{{/*
mock-llm Service
ClusterIP：只给集群内（Argus 的 Runner Pod / 控制面）用，不对外暴露。
控制面若要在宿主上直连，用 kubectl port-forward（见 deploy/README.md）。
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mock-llm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mock-llm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mock-llm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
