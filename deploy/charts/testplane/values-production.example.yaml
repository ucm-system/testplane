# 生产模板 —— 复制成 `values-<env>.yaml` 再改，**不要**直接 -f 这个文件。
#
# 环境里需要先准备好这 4 个 Secret（都不含明文进 values）：
#   kubectl -n testplane create secret generic testplane-db      --from-literal=dsn='postgres://...'
#   kubectl -n testplane create secret generic testplane-oidc    --from-literal=client-secret='...'
#   kubectl -n testplane create secret generic testplane-genet   --from-literal=api-key='...'
#   kubectl -n testplane create secret generic testplane-clusters   # 可选：多集群 kubeconfig
#
# 以及一个支持 RWX 的 StorageClass（NFS CSI / CephFS 等），或预先建好的 PVC。

image:
  repository: ccr.ccs.tencentyun.com/keriko/testplane-server
  # ← 由 `deploy/docker/build-push.ps1 -Push` 打印的 digest（钉死，不用可变 tag）
  digest: "sha256:b7e793621bb5064e61d6496f4b405d430649290cae61b798f978b1b9542b0663"
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: ccr-pull

replicaCount: 2
role: all

config:
  env: prod
  authMode: oidc
  logLevel: info
  clusterName: cluster-01
  maxGlobalConcurrency: 20   # 按 06 §5.4 的容量公式定
  runMaxTasks: 200
  deployProvider: genet

oidc:
  issuer: "https://sso.example.internal/realms/ucm"
  clientID: "testplane"
  redirectURL: "https://testplane.example.internal/api/v1/auth/callback"
  clientAuth: client_secret_basic
  roleClaim: groups
  roleMap: "tp-admins=admin,tp-ops=operator"
  clientSecretRef:
    name: testplane-oidc
    key: client-secret

session:
  secretRef:
    name: testplane-oidc
    key: session-secret
  cookie: tp_session
  ttl: 8h
  secure: true

genet:
  baseURL: "https://genet.example.internal"
  apiKeySecretRef:
    name: testplane-genet
    key: api-key
  # 自签 CA（可选）
  # caConfigMap: genet-ca
  # caFile: /etc/testplane/genet-ca/ca.pem

database:
  existingSecret: testplane-db
  key: dsn

persistence:
  enabled: true
  # 生产推荐：复用运维建好的 RWX claim
  existingClaim: testplane-storage-prod
  # 或者交给动态供给：
  # storageClass: nfs-client
  size: 2Ti

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"   # 请求体上限 1 MiB（07 §9）
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"  # SSE 长连接
    nginx.ingress.kubernetes.io/proxy-buffering: "off"      # SSE 不能被缓冲
  hosts:
    - host: testplane.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: testplane-tls
      hosts:
        - testplane.example.internal

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "4"
    memory: 4Gi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: testplane
