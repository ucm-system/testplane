keywords:
  - testplane
  - llm
  - testing
  - volcano
  - genet
home: https://github.com/ucm-system/testplane
sources:
  - https://github.com/ucm-system/testplane
annotations:
  # 这是**唯一**受支持的部署形态；deploy/k8s 的 kustomize 清单只服务本地 kind 调试。
  testplane.io/docs: "design/views/06-physical-view.md §2、§5；design/impl/web-and-delivery.md §9–§11"
  testplane.io/min-k8s: "1.27（Job/Pod/Lease/PVC/PSA restricted）"
