apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "argus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane
      annotations:
        # 改 ConfigMap 自动滚动（Helm 化之前这里是手写 config-rev，见 W-9）
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "argus.serviceAccountName" . }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      containers:
        - name: argusd
          image: {{ include "argus.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--role={{ .Values.role }}"
            {{- range .Values.args }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "argus.fullname" . }}-config
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # DB DSN 含口令 → 只走 Secret（database.existingSecret 已在 values 校验里强制）
            - name: AG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.database.existingSecret }}
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.key }}
                  {{- else }}
                  name: {{ include "argus.fullname" . }}-db
                  key: dsn
                  {{- end }}
            {{- if eq .Values.config.deployProvider "genet" }}
            - name: AG_GENET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.genet.apiKeySecretRef.name }}
                  key: {{ .Values.genet.apiKeySecretRef.key }}
            {{- end }}
            {{- if eq .Values.config.authMode "oidc" }}
            - name: AG_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.clientSecretRef.name }}
                  key: {{ .Values.oidc.clientSecretRef.key }}
            - name: AG_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.session.secretRef.name }}
                  key: {{ .Values.session.secretRef.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: storage-root
              mountPath: {{ .Values.config.storageRoot }}
            - name: tmp
              mountPath: /tmp
            {{- if and (eq .Values.config.deployProvider "genet") .Values.genet.caConfigMap }}
            - name: genet-ca
              mountPath: /etc/argus/genet-ca
              readOnly: true
            {{- end }}
            {{- if .Values.clustersSecret.name }}
            - name: clusters
              mountPath: /etc/argus/clusters
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # 启动宽限：30×2s = 60s（等 DB / 迁移就绪，W-9）
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # readiness 含 DB ping + 迁移版本匹配 → DB 挂就摘流，不重启
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness **不含 DB**（DB 抖动不该重启进程，W-9）
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: storage-root
          persistentVolumeClaim:
            claimName: {{ include "argus.storageClaim" . }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- if and (eq .Values.config.deployProvider "genet") .Values.genet.caConfigMap }}
        - name: genet-ca
          configMap:
            name: {{ .Values.genet.caConfigMap }}
        {{- end }}
        {{- if .Values.clustersSecret.name }}
        - name: clusters
          secret:
            secretName: {{ .Values.clustersSecret.name }}
            optional: true
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
