# TestPlane 前端（nginx）配置模板
#
# 这个文件是 **模板**：容器启动时由 `deploy/docker/web-entrypoint.sh` 用 envsubst 渲染成
# /etc/nginx/conf.d/default.conf。只有这些变量会被替换（其余 `$uri`/$host 等 nginx 变量
# 不在 envsubst 的白名单里，不会被误吃）：
#
#   ${TESTPLANE_API_UPSTREAM}   可选：把 /api/ 反代到哪（如 http://testplane-api:8080）。
#                               不设 = 纯静态，/api/ 走 SPA fallback（前端会拿到 index.html，
#                               适合 API 由别的域名/网关托管并配了 baseURL 的场景）。
#
# 运行约束（对应 web.Dockerfile）：
#   - 非 root（10001:10001）、只读根：pid / temp / cache 都在可写空挂上（见 nginx.conf 顶部
#     的 pid 与 *_temp_path 指令）；
#   - 监听 8080（非特权端口）；
#   - `/healthz` 固定 200，供 k8s 探针与 docker HEALTHCHECK。

server {
    listen 8080;
    server_name _;

    # 根目录是镜像里的只读层；静态资源不需要写。
    root /usr/share/nginx/html;
    index index.html;

    # 只读根下必须把 nginx 自己要写的东西都指到空挂：
    # README / chart 里挂：
    #   emptyDir -> /tmp, /var/cache/nginx, /var/run
    # （Dockerfile 里已 chown 10001；k8s 记得配 securityContext.fsGroup: 10001）
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    # 不要把 access log 写到 stdout 之外（只读根 + 容器日志约定）
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # ---- 探针 ----------------------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- API：可选反代（SSE 友好）--------------------------------------
    # BEGIN_API_PROXY  <-- entrypoint 在 TESTPLANE_API_UPSTREAM 未设置时删掉这两行之间的块
    location /api/ {
        proxy_pass         ${TESTPLANE_API_UPSTREAM};
        proxy_http_version 1.1;

        # SSE（/runs/{id}/events）必须关掉缓冲，否则事件会被攒着不下发
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 透传客户端信息（后端日志/审计要用真实 IP 与 Host）
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 上传 Run manifest / 工件时不要卡 1MB 默认限制
        client_max_body_size 32m;
    }
    # END_API_PROXY

    # ---- 静态资源：带 hash 的产物长缓存 ---------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- SPA fallback ---------------------------------------------------
    # 前端是单页应用：任何未命中的路径都交给 index.html（/runs、/tasks/xxx 等深链刷新可用）。
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，避免发版后浏览器拿旧壳（带 hash 的资源已长缓存）
        add_header Cache-Control "no-cache";
    }

    # 基础安全响应头（不依赖后端）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip：文本类资源压缩（图片/字体已压缩，不再处理）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
