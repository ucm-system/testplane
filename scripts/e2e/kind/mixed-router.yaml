# 一成一败混合结果专用：按 Authorization 头把请求转发到不同 mock。
#   Bearer ok   -> mock-llm（成功）
#   Bearer fail -> mock-llm-500（失败）
# Task 级 env 可以设置 ENDPOINT_API_KEY，endpoint-probe 会把它放进 Authorization 头，
# 这样同一个 Run 的两个 Task 可以打不同的后端（平台不允许 args 覆盖 --url）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: mixed-router-script
data:
  router.py: |
    import os
    import urllib.request
    import urllib.error
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    OK_URL = "http://mock-llm.default.svc.cluster.local:18080"
    FAIL_URL = "http://mock-llm-500.default.svc.cluster.local:18080"

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _target(self):
            auth = self.headers.get("Authorization", "")
            return FAIL_URL if "fail" in auth.lower() else OK_URL

        def _relay(self):
            length = int(self.headers.get("Content-Length", "0") or "0")
            body = self.rfile.read(length) if length else None
            req = urllib.request.Request(self._target() + self.path, data=body, method=self.command)
            for name in ("Content-Type", "Authorization", "Accept"):
                if self.headers.get(name):
                    req.add_header(name, self.headers[name])
            try:
                resp = urllib.request.urlopen(req, timeout=60)
                status = resp.status
                payload = resp.read()
                ctype = resp.headers.get("Content-Type", "application/json")
            except urllib.error.HTTPError as e:
                status = e.code
                payload = e.read()
                ctype = e.headers.get("Content-Type", "application/json")
            except Exception as e:
                status = 502
                payload = ('{"error":{"code":"router_error","message":%r}}' % str(e)).encode()
                ctype = "application/json"
            self.send_response(status)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path.split("?")[0] == "/healthz":
                data = b"ok"
                self.send_response(200)
                self.send_header("Content-Type", "text/plain")
                self.send_header("Content-Length", str(len(data)))
                self.end_headers()
                self.wfile.write(data)
                return
            self._relay()

        def do_POST(self):
            self._relay()

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 18080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixed-router
  labels: { app: mixed-router }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mixed-router }
  template:
    metadata:
      labels: { app: mixed-router }
    spec:
      containers:
        - name: router
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/router.py"]
          ports: [{ name: http, containerPort: 18080 }]
          volumeMounts:
            - { name: script, mountPath: /app }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
      volumes:
        - name: script
          configMap: { name: mixed-router-script }
---
apiVersion: v1
kind: Service
metadata:
  name: mixed-router
spec:
  selector: { app: mixed-router }
  ports: [{ name: http, port: 18080, targetPort: 18080 }]
