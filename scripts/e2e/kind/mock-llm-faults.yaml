apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm-slow
  labels: { app: mock-llm-slow }
spec:
  replicas: 1
  selector:
    matchLabels: { app: mock-llm-slow }
  template:
    metadata:
      labels: { app: mock-llm-slow }
    spec:
      containers:
        - name: mock-llm
          image: argus/mock-llm:dev
          imagePullPolicy: IfNotPresent
          # 窗口内永远不会就绪：用于断言 precheck 可重试失败 → service_unavailable。
          # 用 24h（不是 3600s）：3600s 的 mock 跑满 1h 后会真的就绪，timeout 用例会“意外成功”。
          args: ["-addr=:18080", "-ready-after=86400s"]
          ports: [{ name: http, containerPort: 18080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 200m, memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm-slow
spec:
  selector: { app: mock-llm-slow }
  ports: [{ name: http, port: 18080, targetPort: 18080 }]
