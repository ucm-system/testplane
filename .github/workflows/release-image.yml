# 控制面镜像发布流水线（W-8 / web-and-delivery §7、§8）
#
# 触发：
#   - push tag `v*`（例如 v0.2.0）→ 构建并**推送**两个 tag（`:<tag>` 与 `:sha-<12>`）
#   - 手工 workflow_dispatch（可指定 tag / 平台，方便补发或回滚验证）
#   - 任何 PR → **只构建不推送**（防止 Dockerfile 腐烂）
#
# 需要的仓库 Secret（Settings → Secrets and variables → Actions）：
#   CCR_USERNAME   ccr.ccs.tencentyun.com 的登录用户名
#   CCR_PASSWORD   对应密码 / 访问令牌
# 可选的仓库 Variable：
#   CCR_REGISTRY   仓库前缀，默认 ccr.ccs.tencentyun.com/keriko（换占位仓库时不用改脚本）
#
# 本地等价命令（先 docker login）：
#   pwsh deploy/docker/build-push.ps1 -Push
#   pwsh deploy/docker/build-push.ps1 -Platforms linux/amd64,linux/arm64 -Push -Tag v0.2.0
name: release-image

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（留空则用 git describe --tags --always --dirty）'
        required: false
        type: string
      platforms:
        description: '目标平台（逗号分隔）'
        required: false
        default: 'linux/amd64'
        type: string

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.CCR_REGISTRY || 'ccr.ccs.tencentyun.com/keriko' }}
  IMAGE: testplane-server
  PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64' }}
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # PR：只构建，不推送。
  build-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史算 git describe / sha tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build（不推送）
        shell: pwsh
        run: |
          ./deploy/docker/build-push.ps1 `
            -Registry "$env:REGISTRY" `
            -Image "$env:IMAGE" `
            -Platforms "$env:PLATFORMS"

  # tag push / 手工触发：构建并推送两个 tag（:<tag> 与 :sha-<12>），digest 写进 job summary。
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}

      - name: Build & push
        id: build
        shell: pwsh
        run: |
          $log = "build-push.log"
          ./deploy/docker/build-push.ps1 `
            -Registry "$env:REGISTRY" `
            -Image "$env:IMAGE" `
            -Tag "$env:RELEASE_TAG" `
            -Platforms "$env:PLATFORMS" `
            -Push 2>&1 | Tee-Object -FilePath $log

          # 脚本最后打印机器可读行：TAG= / REF_SHA= / DIGEST= / PLATFORMS= / PUSHED=
          $meta = @{}
          Get-Content $log | Where-Object { $_ -match '^[A-Z_]+=' } | ForEach-Object {
            $k, $v = $_.Split('=', 2)
            $meta[$k] = $v
          }
          foreach ($k in @('TAG', 'REF_TAG', 'REF_SHA', 'DIGEST', 'PLATFORMS')) {
            "$($k.ToLower())=$($meta[$k])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Job summary
        shell: pwsh
        run: |
          @"
          ### 镜像发布

          | 项 | 值 |
          |---|---|
          | tag | `${{ steps.build.outputs.tag }}` |
          | tag 引用 | `${{ steps.build.outputs.ref_tag }}` |
          | sha 引用（回滚用） | `${{ steps.build.outputs.ref_sha }}` |
          | digest | `${{ steps.build.outputs.digest }}` |
          | 平台 | `${{ steps.build.outputs.platforms }}` |

          > Helm chart 的 ``image.digest`` 填上表的 digest；回滚按 ``sha-<12>`` tag 拉（W-8）。
          > 需要仓库 Secret：``CCR_USERNAME`` / ``CCR_PASSWORD``（可选 Variable ``CCR_REGISTRY``）。
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
