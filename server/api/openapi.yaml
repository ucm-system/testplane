  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: 跨 Run 的 Task 列表（游标分页，按 run_id, seq）
      description: |
        07 §5.2、§6：跨 Run 列表，过滤 `status`、`tester`；排序固定为 `run_id, seq`（07 §6「Task 列表按
        `run_id, seq`」），没有 `sort` 参数。多值过滤用逗号（`status=queued,running`，即 `style: form,
        explode: false`）。`queued` 的 Task 带 `waiting_reason`，各值归属见 `GET /api/v1/queue-status`（C-4.7）。
      tags: [tasks]
