# Argus 控制面 REST 契约（OpenAPI 3.1）
#
# 权威来源（本文件只做机器可读表达，不新增设计）：
#   - design/views/07-api.md          —— 约定 §1、鉴权 §2、错误 §3、提交 §4、端点目录 §5、分页 §6、SSE §7、取消/重试 §8
#   - design/impl/control-plane.md    —— §C-8.2 端点表、§C-5.1 提交校验顺序、§C-9.2 SSE 实现
#   - design/views/03-data-view.md    —— §3.1 列语义、§3.2 CHECK 约束、§4.1–4.10 JSONB 形状
#   - design/ARCHITECTURE.md          —— 附录 C（runner.yaml）、附录 D（错误码 v2）、§8.4（Task 报告）、附录 E D-66～D-73
#
# v2（Argus 更名与 Runner 化改造，2026-11-10）：
#   路径 /runs→/tasks、/testers→/runners；runner 执行记录以 (task_id, attempt_no, seq) 定位；
#   POST /tasks/{id}/retry 语义 = 整 Task 新 attempt（上限 409 ATTEMPT_EXHAUSTED）；runner 级 retry 已删除；
#   错误码 TESTER_*→RUNNER_*、TASK_TIMEOUT→RUNNER_TIMEOUT、RUN_TOO_LARGE→TASK_TOO_LARGE，
#   新增 EXPORT_INVALID / ATTEMPT_EXHAUSTED / DEPLOY_FAILED / DEPLOY_BLOCKED。
#
# 三条硬约束写在这里，避免实现时四处找：
#   1) 提交不做幂等（D-37、07 §4.4、03 §4.9）：每次 POST 都建新资源；本文件**不声明**任何幂等键，
#      也没有任何提交指纹 / 去重字段。重复提交 = 多个 Task，由提交者自行取消多余的那个。
#   2) 字段名 snake_case，时间 RFC3339 且服务端统一 UTC（`Z`）；ID 不透明，客户端不得解析（07 §1）。
#      业务输入不经过 argv：提交体 `runners[].input` 是输入文件原文，entry argv 恒空（D-66）。
#   3) 响应允许新增字段（07 §1）：客户端不得因未知字段失败，故响应 schema 一律 additionalProperties: true。

openapi: 3.1.0

info:
  title: Argus Control Plane API
  version: 0.2.0
  summary: LLM 评测编排平台的控制面 REST API（Argus v2）
  description: |
    # 范围

    端点集（07 §5）：健康检查与运维探针；身份与元信息（`/me`、`/meta`）；
    Task 提交/列表/facets/详情/取消/重试（整 Task 新 attempt）/clean 重放（泄漏兜底，§9.3）/事件流/事件历史/
    报告/`report.md`/
    Manifest 快照/部署快照/部署日志/runner 列表与详情（Task 级与 attempt 级两套定位）/
    runner 结果与日志/两级产物清单/打包下载/文件下载；Runner 目录（只读）；
    Profile 与集群概要；队列状态；Secret 引用只读列表；管理面（Execution Profile / Cluster /
    Secret 引用维护、rotate、审计查询、人工清理产物）。

    # 路径前缀

    07 §1 与 C-8.1 规定：版本化端点统一前缀 `/api/v1`；`/healthz`、`/readyz`、`/metrics` 不带版本。
    因此本文件的 path key 写全量路径（例如 `/api/v1/tasks`），`servers` 只给 origin，不做前缀拼接魔法——
    这样 codegen 出来的路由与设计表逐字一致。

    # 鉴权

    - 服务调用（Jenkins / Agent / CLI）：`Authorization: Bearer <JWT>`，JWKS 校验，`aud == clientId`，
      `exp/nbf` 容差 60s（07 §2.1）。
    - Web UI：OIDC authorization code + PKCE → 会话 Cookie；写操作要求 `X-CSRF-Token`（双提交，值来自
      `GET /api/v1/me`）。本文件只把 Bearer 建模为 securityScheme，Cookie 会话不是 OpenAPI 能表达的
      头/参数形态，CSRF 以可选请求头出现。
    - 无匿名端点，`/healthz`、`/readyz` 除外（07 §2.1）。开发模式是服务端开关（`AG_AUTH_MODE=dev`，C-10），
      不是请求头，故不建模。
    - RBAC：`viewer` 读、`operator` 提交/取消/重试、`admin` 另加维护类操作（07 §2.2）。403 由服务端统一判定。

    # 错误

    统一信封 `{code, message, detail, retryable, trace_id}`（07 §3、C-8.1），`code` 只取附录 D（v2）的枚举，
    HTTP 状态按 07 §3 的映射表；校验失败的 `detail.issues[] = [{path, code, message}]`，`path` 形如
    `runners[2].input`（jsonl 校验失败带行号）。**设计里没有 422**：结构与引用类校验一律 400
    `VALIDATION_ERROR`，故本文件不声明 422。

    # 分页

    游标分页，`{items, next_cursor, has_more}`（07 §6）：`limit` 默认 50、上限 200；`cursor` 不透明；
    排序固定——Task 按 `submitted_at DESC, id DESC`，runner 列表按 `(task_id, attempt_no, seq)`。
    多值过滤用逗号（OpenAPI 表达为 `style: form, explode: false` 的数组参数）。

    # SSE

    `GET /api/v1/tasks/{task_id}/events` 返回 `text/event-stream`：`id` 为事件 `seq`，客户端带
    `Last-Event-ID` 从 `seq+1` 回放；窗口 24h、单次 ≤1000 条，越窗先发 `resync_required`；心跳 15s 一行
    `: ping`；60s 无事件即断开（07 §7、C-9.2）。

  license:
    name: 内部项目（见 CONTRIBUTING.md）
    identifier: LicenseRef-Internal

servers:
  - url: https://{host}
    description: 生产入口（Ingress 终结 TLS；版本化端点的完整路径已含 `/api/v1`）
    variables:
      host:
        default: argus.example.internal
        description: 控制面域名
  - url: http://127.0.0.1:8080
    description: 本地开发（C-11 `AG_LISTEN` 默认 `:8080`，明文）

tags:
  - name: health
    description: 运维探针（07 §5.5）
  - name: auth
    description: 当前身份与认证流程（07 §2.4）：`GET /me`、`/auth/login|callback|logout`（认证端点匿名、不带 /api/v1 前缀）
  - name: meta
    description: 平台元信息与特性开关（C-8.2 `GET /meta`，前端版本对齐用）
  - name: tasks
    description: Task 提交、列表、详情、取消、重试、报告、事件流、Manifest/部署快照（07 §5.1、§8）
  - name: attempts
    description: attempt 与 runner 执行记录的只读查询、结果与日志（07 §5.2，`(task_id, attempt_no, seq)` 定位）
  - name: runners
    description: Runner 目录（07 §5.3、ARCHITECTURE 附录 C；只读，注册靠目录扫描）
  - name: clusters
    description: 集群概要（07 §5.3，不返回凭据）
  - name: queue
    description: 队列与槽位可见性（07 §5.3、C-4.7，不读凭据）
  - name: profiles
    description: Execution Profile 与挂载能力（07 §5.3、06 §3，只读）
  - name: artifacts
    description: Task / runner 级产物清单（07 §5.1、§5.2、C-7.5）
  - name: files
    description: 产物下载（07 §5.1，支持 Range，不越出 Task 目录）
  - name: secrets
    description: Secret 引用只读列表（07 §5.3、C-10：只回名称与说明，不回显值；operator 及以上）
  - name: admin
    description: 管理面（07 §5.4、C-10）：Execution Profile / Cluster / Secret 引用维护、rotate、审计查询、人工清理产物；全部要求 admin

security:
  # 两种凭据二选一：Cookie 会话（浏览器）或 Bearer JWT（服务间）；RBAC 同一套（07 §2.1）。
  - bearerAuth: []
  - cookieAuth: []

paths:
  # ======================================================================
  # 运维探针（不带版本前缀，无鉴权）
  # ======================================================================
  /healthz:
    get:
      operationId: getHealthz
      summary: 进程存活探针
      description: |
        07 §5.5：进程存活。返回纯文本，K8s liveness 探针直接读状态码。
        开发模式（`AG_AUTH_MODE=dev`）下会在应答里打印警告（C-10），因此不固定正文内容。
      tags: [health]
      security: []
      responses:
        '200':
          description: 进程存活
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本，内容不作为契约（示例仅示意）
              example: ok

  /readyz:
    get:
      operationId: getReadyz
      summary: 就绪探针（DB + 存储可写 + 迁移版本）
      description: |
        07 §5.5：检查 DB 连接、存储可写、迁移版本一致；**不含 K8s**（K8s 不可达不该摘掉 API 副本）。
        04 (process-view) §DB 不可用：`/readyz` 失败即摘流。
      tags: [health]
      security: []
      responses:
        '200':
          description: 就绪
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本，内容不作为契约
              example: ok
        '503':
          description: 未就绪（DB 不可用 / 存储不可写 / 迁移版本不一致）；正文给出失败项，供人排查
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/plain:
              schema:
                type: string
              example: storage not writable

  # ======================================================================
  # 身份与元信息
  # ======================================================================
  /api/v1/meta:
    get:
      operationId: getMeta
      summary: 平台元信息（版本 / API 版本 / 特性开关）
      description: |
        C-8.2、07 §5.3：`GET /meta` 返回 `{version, api_version, features}`，供前端做版本对齐与特性开关。
        `api_version` 是 URL 主版本（`v1`，07 §1「URL 主版本」）；`features` 是本实例开启的能力开关，
        客户端只读、不据此推断状态（状态一律以 Task/runner 投影为准）。
      tags: [meta]
      responses:
        '200':
          description: 平台元信息
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me:
    get:
      operationId: getMe
      summary: 当前用户与角色
      description: |
        07 §2.4 认证端点表、C-8.2：`GET /me` 返回 `{user, role}`。本实例另带两个非核心字段：
        `csrf_token`（UI 写操作双提交用，Bearer 调用方可忽略）与 `groups`（身份源里的组）。
      tags: [auth]
      responses:
        '200':
          description: 当前身份
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ======================================================================
  # Task（提交 / 列表 / 详情 / 取消 / 重试）
  # ======================================================================
  /api/v1/tasks:
    post:
      operationId: submitTask
      summary: 提交 Task（YAML 或 JSON Manifest；不做幂等）
      description: |
        07 §4：异步编排，202 表示已受理并落库，后续状态由 SSE 或轮询获取。
        提交体是嵌套 `task:`（D-40）：`deploy` 与 `service` 互斥（都填或都不填拒绝）；`runners[]` 可为 0（D-77：只验证服务能否启动时只跑 deploy/precheck/clean）、
        至多 200 条（D-57、§12.7）；service-deploy / precheck / service-clean 由平台按提交配置自动注入，
        用户不可手动添加（D-70）。

        提交校验顺序见 C-5.1（结构 → deploy XOR service → runner 数 → Runner/Profile/Secret 引用命中 →
        jsonl 输入结构校验（类型 + required，带行号，D-67）→ exports/consumes 闭合 → on_failure 不得弱化 →
        必填 env），遇到第一个错误即返回，同一层可聚合多个 issue（400 `VALIDATION_ERROR`）。

        **不做幂等（D-37）**：每次 POST 都创建新 Task，客户端超时重发即两个 Task；本端点没有幂等键，
        也没有提交指纹或判重逻辑。想避免重复请提交前查 `GET /api/v1/tasks?submitter=…`。

        `dry_run=true` 只校验不落库，返回 200 + `DryRunResult`。

        Manifest 可传 YAML 文档或 JSON 对象，两者是同一份结构（07 §1「Manifest 可传 YAML 字符串或 JSON 对象」）。
      tags: [tasks]
      parameters:
        - name: dry_run
          in: query
          required: false
          description: '`true` 时只校验、不落库（07 §4.1、C-5.1）'
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        description: |
          Task Manifest（07 §4.1）。顶层是 `task:`，`deploy` 与 `service` 二选一（D-27）。
          未知字段忽略（07 §1）；请求体 ≤ 1 MiB，超限 413。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskManifest'
            example:
              task:
                name: qwen3-32b-daily
                deploy:
                  provider: genet
                  spec: |
                    model: Qwen3-32B
                    replicas: 1
                    resources: { gpu: 8 }
                precheck: auto
                env:
                  LOG_LEVEL: info
                secrets:
                  ENDPOINT_API_KEY: endpoint/prod-qwen
                runners:
                  - name: accuracy-dataset-a
                    runner: aisbench-acc
                    version: 1.0.0
                    execution:
                      profile: k8s-npu
                    on_failure: continue
                    input: |
                      {"dataset":"/data/dataset-a","limit":100}
                  - name: performance-sweep
                    runner: aisbench-perf
                    version: 1.0.0
                    execution:
                      profile: k8s-npu
                    on_failure: abort_task
                    timeout_seconds: 14400
                    input: |
                      {"input":512,"output":128,"concurrency":1}
                      {"input":512,"output":128,"concurrency":4}
          # YAML 与 JSON 是同一份结构（YAML 1.2 是 JSON 超集），故共用同一结构：
          # 服务端按 Content-Type 决定用 YAML 还是 JSON 解析，字段语义完全相同。
          application/yaml:
            schema:
              $ref: '#/components/schemas/TaskManifest'
            example:
              task:
                name: qwen3-32b-daily
                service:
                  url: http://10.0.0.10:8000/v1
                  model_name: Qwen3-32B
                  model_path: /models/Qwen3-32B
                precheck: auto
                runners:
                  - name: accuracy-dataset-a
                    runner: aisbench-acc
                    version: 1.0.0
                    execution:
                      profile: k8s-npu
                    input: |
                      {"dataset":"/data/dataset-a"}
      responses:
        '200':
          description: dry-run 结果（只校验，不落库）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '202':
          description: 已受理并落库（07 §4.2；含注入的 service-deploy / precheck / service-clean 的最终执行序）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      operationId: listTasks
      summary: Task 列表（游标分页，按提交时间倒序）
      description: |
        07 §5.1、§6：过滤 `status`、`submitter`、`runner`；游标编码 `(submitted_at, id)` 倒序，
        客户端只回传不解析；**排序固定**，没有 `sort` 参数（07 §6「排序固定为提交时间倒序」）。
        未知过滤字段返回 400（07 §6）。多值过滤用逗号：`status=running,queued`。
      tags: [tasks]
      parameters:
        - name: status
          in: query
          required: false
          description: 多值，逗号分隔（`status=running,queued`）；取值见 `TaskStatus`
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TaskStatus'
        - name: runner
          in: query
          required: false
          description: Runner 名称；返回包含该 Runner 执行记录的 Task
          schema:
            type: string
        - name: submitter
          in: query
          required: false
          description: |-
            提交者（`tasks.submitted_by`，身份源 subject）。多值用逗号：`submitter=dev,qa`（07 §6 的多值约定）。
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: |-
            offset 分页页码（从 1 开始）；与 `cursor` 互斥——给了 `page` 就忽略 `cursor`（D-61）。
            UI 用这套拿"第几页/共几页"，agent 与 CLI 仍用 `cursor`/`limit`。
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          description: offset 分页每页条数（默认 20，上限 100）
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Task 列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/facets:
    get:
      operationId: listTaskFacets
      summary: Task 列表的列筛选候选值（Excel 式筛选）
      description: |
        D-61 / 07 §5.1：给 UI 的表头下拉用——返回 `status` / `submitter` / `runner`
        三个维度的**取值与计数**。过滤参数与 `GET /api/v1/tasks` 完全一致（同名的多值约定也一样），
        但计数**不受当前页限制**：它回答"在当前过滤条件下，这一列有哪些值、各多少条"。
        计数按维度独立计算（即每个维度只应用其它维度的过滤，不应用自己那维，标准的 facet 语义）。
      tags: [tasks]
      parameters:
        - name: status
          in: query
          required: false
          description: 多值，逗号分隔；作为过滤条件参与**其它**维度的计数
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TaskStatus'
        - name: runner
          in: query
          required: false
          schema:
            type: string
        - name: submitter
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 各维度候选值与计数
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskFacets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/tasks/{task_id}:
    get:
      operationId: getTask
      summary: Task 详情（含 attempt 列表与最新 attempt 的 runner 摘要）
      description: |
        07 §5.1：详情 + attempt 列表 + runner 摘要。03 §5 要求用**一条 JOIN** 取 runner 摘要，禁止 N+1，
        故 `runners[]` 是最新 attempt 的摘要形态（完整字段走 `/tasks/{id}/attempts/{n}/runners/{seq}`，
        历史 attempt 走 `attempts[]` 后按 attempt_no 查询）。Task 级报告默认取最后一个 attempt（§7.2）。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task 详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{task_id}/cancel:
    post:
      operationId: cancelTask
      summary: 取消 Task（终止当前 runner → 执行 service-clean → 落终态）
      description: |
        07 §5.1、§8、C-6.1：前置条件为**非终态**；CAS 到 `cancelling` 后异步收口。
        取消语义（§7.6）：先终止当前 runner（Executor 删 Job），`pending`/`queued` 的 runner 标
        `skipped(reason=canceled)`（传播到 clean 为止），随后**追加执行 service-clean**（若本 Task 含部署），
        clean 结束后 Task 才落 `canceled`。
        重复调用语义（07 §8）：已是 `cancelling` / `canceled` 时返回 **200** 且状态不变，否则 **202**。
        取消与自然结束竞态：以先落库状态为准，客户端以 SSE 推送为最终结果，不做乐观更新。
        `If-Match` 为可选乐观锁（07 §1），版本不匹配返回 409 `CONFLICT`。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已受理取消，状态为 `cancelling`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAccepted'
        '200':
          description: 已经是 `cancelling` / `canceled`，幂等回同一状态（07 §8）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/tasks/{task_id}/retry:
    post:
      operationId: retryTask
      summary: 整 Task 重试（新建 attempt，全量重跑含 fresh deploy）
      description: |
        07 §8、ARCHITECTURE §7.8（D-69）：重试 = 整 Task 新 attempt，**全量重跑**，含重新部署（fresh deploy）；
        runner 级平台重试不存在（v1 的 runner 级 retry 端点已删除）。

        前置为 **Task 终态**（`succeeded` / `failed` / `service_unavailable` / `canceled`）且 attempt 数未达上限
        （平台配置，默认 3，§12.7）；正在执行返回 409 `CONFLICT`；达到上限返回 409 `ATTEMPT_EXHAUSTED`。

        行为：
        - `task_attempts` 追加一行：`attempt_no = current_attempt + 1`、`trigger='retry'`（历史 attempt 不覆盖）；
        - 按 `tasks.resolved` 重新生成全部 runner 执行记录（含注入的 service-deploy / precheck / service-clean）；
        - **不得复用上一次 attempt 的已部署服务**（warm cache 污染测量，§7.8）；
          release 名按 `(task_id, attempt_no)` 重新派生（03 §4.4，天然 fresh）；
        - 输入快照原样重用（落档 `attempts/<n>/input/`，下按 `input/<seq>/` 分 runner 子目录，E-Q8），Runner/镜像引用按 resolved 冻结；
        - 写审计 `action=retry`。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已受理，返回新 attempt 信息
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRetryAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            状态冲突：`CONFLICT`（Task 仍在执行）、`ATTEMPT_EXHAUSTED`（attempt 达上限，§12.7）、
            `CANCELED`（取消正在收口）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{task_id}/clean:
    post:
      operationId: replayTaskClean
      summary: 重放 service-clean（泄漏兜底的 REST 形态；`argus clean --task` 的底层）
      description: |
        ARCHITECTURE §9.3 / D-72：平台崩溃 / 节点丢失导致 clean Job 未被调度（或未成功）时，
        用**落档的 deploy 导出**（`task_attempts.exports_ref` 的合并注入清单 + `deploy-state.json`
        副本，`AG_DEPLOY_REF` 等）重新拉起一次内置 service-clean Job。平台仍是哑平台，
        只是重放一个 Job，不引入平台侧 GC。

        前置条件（不满足 → 409 `CONFLICT`，`detail.reason` 区分）：

        - 目标 attempt **含部署**（存在 service-deploy runner 且导出了 `AG_DEPLOY_REF`）；
          外接模式（无部署）→ `no_deploy`；`deploy.provider=existing`（已有服务登记，无可拆除
          对象，clean 未注入）→ `nothing_to_clean`；
        - 该 attempt **无成功的 clean 记录**（service-clean 未 `succeeded`）；
          已有成功记录且未显式 `force=true` → `clean_already_verified`；
        - Task **非终态**（仍在执行）→ `task_running`（避免与管道内的正常 clean 竞争）；
        - 已有进行中的 clean 重放 → `clean_replay_in_progress`。

        行为：

        - `attempt` 缺省取**最后一个 attempt**（`tasks.current_attempt`）；
        - 在该 attempt 内**追加**一条 service-clean 执行记录：`name=service-clean-replay`、
          新 `seq`（位于原管道 seq 之后，`(task_id, attempt_no, seq)` 唯一，D-68），
          状态从 `pending` 走 runner 状态机；
        - 幂等由 Job 幂等键（`(task_id, attempt_no, seq)` 派生，附录 B）保证，重复执行不产生第二个 Job；
        - 重放失败**不改变 Task 终态**：只记 `cleanup_failed` 事件（复用 `runner_finished` SSE 事件，
          无新增事件类型，07 §7），留在重放清单里可再次重放（07 §8）；
        - 写审计 `action=clean_replay`（object_type=`task`）。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        description: 可选请求体；整个 body 缺省等价于 `{}`（最后一个 attempt、不 force）
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanReplayRequest'
      responses:
        '202':
          description: 已受理重放，返回重放的 runner 执行定位
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanReplayAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            状态冲突（`CONFLICT`）：`detail.reason ∈ {no_deploy, nothing_to_clean,
            clean_already_verified, task_running, clean_replay_in_progress}`（见上方前置条件）。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/tasks/{task_id}/report:
    get:
      operationId: getTaskReport
      summary: Task 汇总报告（report.json）
      description: |
        07 §5.1、C-7.2：返回 Task 的 `report.json`，结构见 ARCHITECTURE §8.4——只做组织与索引，
        不对指标做聚合；默认取**最后一个 attempt**（§7.2），`runners[]` 带该 attempt 的逐 runner 状态。
        报告由 `task_finished` 后异步生成；**文件尚未生成时返回 404 + `Retry-After`**（C-7.2）。
        单 Task 报告 > 20 MiB 时返回摘要（`truncated: true` + `report_ref`）。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task 报告
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReportNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{task_id}/report.md:
    get:
      operationId: getTaskReportMarkdown
      summary: Task 报告的人可读摘要（text/markdown）
      description: |
        C-8.2、ARCHITECTURE §8.2：`report.md` 由平台在 `task_finished` 后与 `report.json` 一同生成，
        是人类可读摘要。与 `report.json` 一致：**文件尚未生成时返回 404 + `Retry-After`**（C-7.2）。

        正文是 Markdown 原文，平台不做 HTML 渲染——渲染在 UI 侧完成，须按不可信文本处理（Runner 自述内容）。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Markdown 报告
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/markdown:
              schema:
                type: string
                description: Markdown 原文
              example: |
                # t-20261110-0001 · qwen3-32b-daily

                - 状态：failed
                - runner：4（成功 2 / 失败 1 / 跳过 1）

                ## 失败

                - seq 3 accuracy-dataset-b：RUNNER_NONZERO_EXIT
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReportNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{task_id}/events:
    get:
      operationId: streamTaskEvents
      summary: Task 事件流（SSE，支持 Last-Event-ID 回放）
      description: |
        07 §7、C-9.2。客户端用 fetch + ReadableStream（不用原生 EventSource）以便带头与处理 401/429。

        帧格式：
        ```text
        id: 43
        event: runner_finished
        data: {"seq":43,"type":"runner_finished","task_id":"t-…","attempt_no":1,"runner_seq":3,"at":"…","payload":{"status":"failed","error_code":"RUNNER_NONZERO_EXIT"}}
        ```

        事件类型（07 §7、ARCHITECTURE §12.6）：`submitted`、`state_changed`、`runner_started`、
        `runner_finished`、`exports_harvested`、`clean_finished`、`cleanup_failed`、`task_finished`、
        `report.written`、`resync_required`。

        规则：从 `Last-Event-ID + 1` 回放；窗口 24h、单次 ≤1000 条，越窗先发 `event: resync_required`
        （客户端整页重建）；心跳 15s 一行 `: ping`；60s 无事件或客户端断开即释放；同一用户同一 Task 的
        并发连接有上限，超限 429；只发状态事实，不发日志正文、不发凭据。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: Last-Event-ID
          in: header
          required: false
          description: 上一次收到的事件 `seq`；缺省表示不回放（只推实时事件）
          schema:
            type: string
      responses:
        '200':
          description: 事件流（长连接）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧文本；`data` 为事件对象 JSON
              example: |
                id: 43
                event: runner_finished
                data: {"seq":43,"type":"runner_finished","task_id":"t-20261110-0001","attempt_no":1,"runner_seq":3,"at":"2026-11-10T01:12:09Z","payload":{"status":"succeeded","exit_code":0}}

                : ping
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/tasks/{task_id}/events/history:
    get:
      operationId: listTaskEvents
      summary: Task 事件历史（JSON，供时间线首屏与断线补齐）
      description: |
        C-8.2、07 §5.1：与 SSE 同一份事件事实流（`state_events`，03 §3.2），用 JSON 拉取，供详情页右栏
        时间线首屏与断线补齐。`seq` 在同一 Task 内单调且唯一（`state_events_seq_uq`），客户端按 `seq` 去重。

        窗口与 SSE 一致：24h（`AG_SSE_REPLAY_HOURS`）、单次 ≤1000 条（C-9.2）。越窗不静默截断——
        SSE 侧发 `resync_required`，本端点因 `since_seq` 明确指向序号，直接按库中现存行返回。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: since_seq
          in: query
          required: false
          description: 只返回 `seq > since_seq` 的事件；缺省 `0`（从头取，受 24h 窗口约束）
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: 本次返回条数，默认 200、上限 1000（C-9.2 单次回放上限）
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: 事件历史（按 `seq` 升序）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{task_id}/manifest:
    get:
      operationId: getTaskManifest
      summary: Manifest 快照（提交原文 + 冻结解析结果）
      description: |
        C-8.2、07 §5.1：用于「照上次配置再来一次」与事后核对。`manifest` 是提交原文（03 §4.1
        `tasks.manifest`），`resolved` 是冻结的解析结果（03 §4.2 `tasks.resolved`：注入的 precheck、
        最终执行序、输入快照摘要、默认超时、公共参数来源）。

        两者一经落库不再变：注册表、Profile、Cluster 之后的变化都不影响这份快照，因此本端点回答的是
        "当时提交了什么"，不是"现在会解析成什么"。`secrets` 只出现引用名，不含取值（C-10）。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Manifest 快照
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestSnapshot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{task_id}/deploy:
    get:
      operationId: getTaskDeploy
      summary: 部署快照（deploy-state 副本 / 排队水位 / Endpoint / Pods）
      description: |
        C-8.2、07 §5.1「部署快照」：`tasks.deploy`（03 §4.4：提交冻结的部署描述 + `deploy-state.json`
        副本摘要）+ Pod 拓扑（`deploy-state.json` 的 `pods[]`：名称、角色、节点、重启次数，§9.1/§9.2）。

        平台**不再直连 Genet**（D-70）：部署由内置 service-deploy runner 执行，状态由它周期写入
        `deploy-state.json`、平台按 attempt 归档；`phase ∈ queued|accepted|deploying|ready|blocked`。
        多 Pod 场景下 `pods[]` 是唯一能还原拓扑的地方；**Endpoint 的 `url` 只取 deploy exports 收割值**，
        平台不按角色推导主 URL（§9.1）。没有部署的 Task（外接模式）返回 `deploy: null`、`pods: []`。
        本端点**不含日志正文**——日志走 `GET /tasks/{id}/deploy/logs`（`?pod=` 可选，单 Pod 游标）；
        `phase=blocked` 会让该 runner 判失败（`DEPLOY_BLOCKED`）并把 Task 收口为 `service_unavailable`（§7.5）。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 部署快照
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploySnapshot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{task_id}/deploy/logs:
    get:
      operationId: getTaskDeployLogs
      summary: Deploy Pod 日志（按 Pod 分页签 + 重启/gap 标记）
      description: |
        07 §5.1：部署 Pod 日志在 deploy runner 的产物目录
        `attempts/<n>/runners/<deploy_seq>/logs/<pod>.log`（按 Pod 一份、持续追加，§8.6、D-26/D-59），
        本端点是它的读取口，并对"断过"的地方显式标 gap。
        盘上缺失才降级实时读 `pods/log`（只读，不授予 `pods/exec`），并在响应里标注实时窗口。

        **排队期没有 Pod** 时返回 `200` + `pods: []` + `entries: []` + `message`，
        不是 404。外接模式（无部署）同理（`message` 说明原因）。

        分页：`offset` 是每个 Pod 日志流里的行偏移，`limit` 是本次返回的总行数上限；
        `truncated` 为 true 时用 `next_offset` 续读（`next_offset=0` 表示没有更多）。
        `tail_lines` 只取每个 Pod 末尾 N 行（"先看最新"）。

        `gaps[]` 是**事实缺口**，不是错误：Pod 重启过（`restart_count > 0`）或 Pod 晚于 deploy 受理才启动，
        都会产出一条，解释"这里为什么断"。平台**不假装日志连续**（§8.6）。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: attempt
          in: query
          required: false
          description: attempt 序号；缺省取最新 attempt
          schema:
            type: integer
            minimum: 1
        - name: pod
          in: query
          required: false
          description: |
            **可选**：要读哪个 Pod 的日志；不传时按 Pod 数量决定：

            | Pod 数 | 行为 |
            |---|---|
            | 0 | `200` + `pods:[]` + `message`（排队中 / Pod 已回收），`window: "full"` |
            | 1 | 直接服务这个 Pod（`200`，不必知道 Pod 名） |
            | ≥2 | `409 CONFLICT`，`detail.reason=pod_ambiguous` + `available_pods[]`（**不默默取第一个**） |

            给了 `pod` 但不在当前列表里 → `404 NOT_FOUND`（`detail.reason=pod_not_found` + `available_pods[]`）。
            `pods[]` 始终返回全部 Pod，供页签渲染。
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: |
            **该 Pod 全文窗口**里的行偏移（默认 0）。只在 `window: "full"` 时有效；
            与 `tail_lines` 同时给出 → `400 VALIDATION_ERROR`（两个窗口的行号基准不同，混用必然重复/漏行）。
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: 本次返回的总行数（默认 200，上限 2000）
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
        - name: tail_lines
          in: query
          required: false
          description: |
            只取该 Pod **末尾 N 行**（默认 0 = 不限，上限 5000）。

            > **tail 不可续页**：`tail_lines>0` 时响应 `window: "tail"`，
            > 一次返回整个末尾窗口，`truncated=false`、`next_offset=0`。想翻完整个日志就改用
            > 全文窗口（不带 `tail_lines`，从 `offset=0` 读）。
            > 与 `offset` 同时给出 → `400`。
          schema:
            type: integer
            minimum: 0
            maximum: 5000
            default: 0
      responses:
        '200':
          description: Deploy Pod 日志（排队时为空列表 + message）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogs'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: |
            省略 `pod` 但该部署有多个 Pod（`detail.reason=pod_ambiguous`，
            并给出 `available_pods[]`）。**端点不会替你挑一个**。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            执行集群不可用，或缺少 `pods/log` 权限（`EXECUTOR_UNAVAILABLE`）。
            **403 不会映射成 500**：它是"平台没权限"，属于可解释的可重试错误。
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

