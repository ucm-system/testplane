                $ref: '#/components/schemas/TaskList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{run_id}/manifest:
    get:
      operationId: getRunManifest
      summary: Manifest 快照（提交原文 + 冻结解析结果）
      description: |
        C-8.2、07 §5.1：用于「照上次配置再来一次」与事后核对。`manifest` 是提交原文（03 §4.1
        `runs.manifest`），`resolved` 是冻结的解析结果（03 §4.2 `runs.resolved`：注入的 Pre-Check、
        切分后的 argv、默认超时、Endpoint 来源）。

        两者一经落库不再变：注册表、Profile、Cluster 之后的变化都不影响这份快照，因此本端点回答的是
        "当时提交了什么"，不是"现在会解析成什么"。`secrets` 只出现引用名，不含取值（C-10）。
      tags: [runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Manifest 快照
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestSnapshot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{run_id}/deploy:
    get:
      operationId: getRunDeploy
      summary: 部署快照（状态 / 排队 / Pod 拓扑）
      description: |
        C-8.2、07 §5.1「部署快照（状态/排队/Endpoint/Pods）」：`runs.deploy`（03 §4.4）+
        实际提交给 Genet 的参数快照（`deploy/manifest.yaml`，ARCHITECTURE §8.2）+ Pod 拓扑
        （`deploy/pods.json`：名称、角色、节点、重启次数、日志区间，ARCHITECTURE §8.1）。

        多 Pod 场景下 `pods[]` 是唯一能还原拓扑的地方；**Endpoint 的 `url` 只取 Genet 返回值**，
        平台不按角色推导主 URL（execution §9.1）。没有 Deploy 的 Run（`service` 模式或独立 Task）
        返回 `deploy: null`、`pods: []`。本端点**不含日志正文**（`/runs/{id}/deploy/logs` 不在本契约内）；
        `deploy.state` 的 `blocked` 会让 Run 收口为 `service_unavailable`（C-5.3）。
      tags: [runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: 部署快照
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploySnapshot'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ======================================================================
  # Task / Attempt
