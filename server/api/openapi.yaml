          description: 本次返回的字节上限，服务端再按 ≤64 KiB 收敛
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 65536
      responses:
        '200':
          description: 日志文本
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Log-Offset:
              $ref: '#/components/headers/X-Log-Offset'
            X-Log-Coverage:
              $ref: '#/components/headers/X-Log-Coverage'
          content:
            text/plain:
              schema:
