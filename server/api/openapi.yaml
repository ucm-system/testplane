    get:
      operationId: getTaskRunnerLogs
      summary: runner 日志（text/plain；缺省最新 attempt）
      description: |
        07 §5.2、C-7.5：日志明文（不做脱敏），单次返回 ≤ 64 KiB；
        翻页用 `offset` + `limit`，同一坐标系由响应头 `X-Log-Offset`（本次结束处的字节偏移，下次从这里继续）
        与 `X-Log-Coverage`（本次覆盖的时间段 `<start>/<end>`）交代。**日志不走 SSE**——那会把它变成
        大流量通道（C-9.2）；超过 10k 行由前端虚拟滚动（07 §5.2）。
      tags: [attempts]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/RunnerSeq'
        - $ref: '#/components/parameters/AttemptQuery'
        - name: stream
          in: query
          required: false
          description: 选择 stdout 或 stderr；缺省返回合并流
          schema:
            type: string
            enum: [stdout, stderr]
        - name: offset
          in: query
