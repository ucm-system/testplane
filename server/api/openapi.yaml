        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{task_id}/attempts/{idx}/result:
    get:
      operationId: getTaskAttemptResult
      summary: Attempt 的 result.json（Tester 产出）
      description: |
        07 §5.2、ARCHITECTURE 附录 A：返回该 Attempt 的 `result.json` 原文。平台只校验不收窄字段
        （K-10「字段不限制，Tester 自维护」），故 `Result` 允许任意未知字段。

        每个 Attempt 各自产出一份、历史不覆盖；`FAILED` 的 Attempt 也可能有可读结果（ARCHITECTURE §8.5
        「部分结果必须可以单独获取」）。文件缺失或非法由平台收口时判 `RESULT_MISSING` / `RESULT_INVALID`
        （C-7.1），此时本端点 404。
      tags: [attempts]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AttemptIdx'
      responses:
        '200':
          description: Attempt 的 result.json
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/tasks/{task_id}/attempts/{idx}/logs:
    get:
      operationId: getTaskAttemptLogs
      summary: Attempt 日志（text/plain）
      description: |
        07 §5.2、C-7.5：日志明文（K-5 已拍板不做脱敏），单次返回 ≤ 64 KiB；
        翻页用 `offset` + `limit`，同一坐标系由响应头 `X-Log-Offset`（本次结束处的字节偏移，下次从这里继续）
        与 `X-Log-Coverage`（本次覆盖的时间段 `<start>/<end>`）交代。**日志不走 SSE**——那会把它变成
        大流量通道（C-9.2）；超过 10k 行由前端虚拟滚动（07 §5.2）。
      tags: [attempts]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/AttemptIdx'
        - name: stream
          in: query
          required: false
          description: 选择 stdout 或 stderr；缺省返回合并流
          schema:
            type: string
            enum: [stdout, stderr]
        - name: offset
          in: query
          required: false
          description: 起始偏移（字节）；缺省从头开始
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: 本次返回的字节上限，服务端再按 ≤64 KiB 收敛
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 65536
      responses:
        '200':
          description: 日志文本
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Log-Offset:
              $ref: '#/components/headers/X-Log-Offset'
            X-Log-Coverage:
              $ref: '#/components/headers/X-Log-Coverage'
          content:
            text/plain:
              schema:
                type: string
              example: |
                [2026-11-05T01:00:00Z] dataset loaded: /data/a
                [2026-11-05T01:12:10Z] accuracy=0.812
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

