    get:
      operationId: getTask
      summary: Task 详情（含 Attempt 列表）
      description: |
        07 §5.2、C-8.2：详情 + Attempt 列表。`args_raw` / `args_argv` / `injected_argv` 三份都返回，
        保证事后能完整还原"当时传了什么"（03 §3.1、C-8.5）。
      tags: [tasks]
