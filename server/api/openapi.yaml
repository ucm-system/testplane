# TestPlane 控制面 REST 契约（OpenAPI 3.1）
#
# 权威来源（本文件只做机器可读表达，不新增设计）：
#   - design/views/07-api.md          —— 约定 §1、鉴权 §2、错误 §3、提交 §4、端点目录 §5、分页 §6、SSE §7、取消/重试 §8
#   - design/impl/control-plane.md    —— §C-8.2 端点表、§C-5.1 提交校验顺序、§C-9.2 SSE 实现
#   - design/views/03-data-view.md    —— §3.1 列语义、§3.2 CHECK 约束、§4.1–4.8 JSONB 形状
#   - design/ARCHITECTURE.md          —— 附录 C（tester.yaml）、附录 D（错误码）、§8.4（Run 报告）
#
# 三条硬约束写在这里，避免实现时四处找：
#   1) 提交不做幂等（D-37、07 §4.4、03 §4.9）：每次 POST 都建新资源；本文件**不声明**任何幂等键，
#      也没有任何提交指纹 / 去重字段。重复提交 = 多个 Run，由提交者自行取消多余的那个。
#   2) 字段名 snake_case，时间 RFC3339 且服务端统一 UTC（`Z`）；ID 不透明，客户端不得解析（07 §1）。
#   3) 响应允许新增字段（07 §1）：客户端不得因未知字段失败，故响应 schema 一律 additionalProperties: true。

openapi: 3.1.0

info:
  title: TestPlane Control Plane API
  version: 0.1.0
  summary: LLM 测试编排平台的控制面 REST API（MVP）
  description: |
    # 范围

    MVP 端点集，共 25 个操作：健康检查（`/healthz`、`/readyz`）；身份与元信息（`/me`、`/meta`）；
    Run 提交/列表/详情/Task 列表/取消/事件流/事件历史/报告/`report.md`/Manifest 快照/部署快照；
    跨 Run 的 Task 列表/详情/取消/Attempt 列表/Attempt 结果/Attempt 日志；Tester 读取；集群概要；队列状态。

    **不在本契约内**（07 §5 列出，但不在 MVP 裁决内）：`POST /tasks`、`POST /runs/{id}/retry`、
    `GET /runs/{id}/retry-plan`、`POST /tasks/{id}/retry`、`GET /testers/{name}/versions/{v}`、`/profiles`、
    `/secrets`、`/admin/*`、`GET /runs/{id}/deploy/logs`、`GET /runs/{id}/artifacts`、`GET /runs/{id}/files`。

    # 路径前缀

    07 §1 与 C-8.1 规定：版本化端点统一前缀 `/api/v1`；`/healthz`、`/readyz`、`/metrics` 不带版本。
    因此本文件的 path key 写全量路径（例如 `/api/v1/runs`），`servers` 只给 origin，不做前缀拼接魔法——
    这样 codegen 出来的路由与设计表逐字一致。

    # 鉴权

    - 服务调用（Jenkins / Agent / CLI）：`Authorization: Bearer <JWT>`，JWKS 校验，`aud == clientId`，
      `exp/nbf` 容差 60s（07 §2.1）。
    - Web UI：OIDC authorization code + PKCE → 会话 Cookie；写操作要求 `X-CSRF-Token`（双提交，值来自
      `GET /api/v1/me`）。本文件只把 Bearer 建模为 securityScheme，Cookie 会话不是 OpenAPI 能表达的
      头/参数形态，CSRF 以可选请求头出现。
    - 无匿名端点，`/healthz`、`/readyz` 除外（07 §2.1）。开发模式是服务端开关（`--auth=dev`，C-10），
      不是请求头，故不建模。
    - RBAC：`viewer` 读、`operator` 提交/取消、`admin` 另加维护类操作（07 §2.2）。403 由服务端统一判定。

    # 错误

    统一信封 `{code, message, detail, retryable, trace_id}`（07 §3、C-8.1），`code` 只取附录 D 的枚举，
    HTTP 状态按 07 §3 的映射表；校验失败的 `detail.issues[] = [{path, code, message}]`，`path` 形如
    `tests[2].args`。**设计里没有 422**：结构与引用类校验一律 400 `VALIDATION_ERROR`，故本文件不声明 422。

    # 分页

    游标分页，`{items, next_cursor, has_more}`（07 §6）：`limit` 默认 50、上限 200；`cursor` 不透明；
    排序固定——Run 按 `submitted_at DESC, id DESC`，Task 按 `run_id, seq`。多值过滤用逗号（OpenAPI 表达为
    `style: form, explode: false` 的数组参数）。

    # SSE

    `GET /api/v1/runs/{run_id}/events` 返回 `text/event-stream`：`id` 为事件 `seq`，客户端带
    `Last-Event-ID` 从 `seq+1` 回放；窗口 24h、单次 ≤1000 条，越窗先发 `resync_required`；心跳 15s 一行
    `: ping`；60s 无事件即断开（07 §7、C-9.2）。

  license:
    name: 内部项目（见 CONTRIBUTING.md）
    identifier: LicenseRef-Internal

servers:
  - url: https://{host}
    description: 生产入口（Ingress 终结 TLS；版本化端点的完整路径已含 `/api/v1`）
    variables:
      host:
        default: testplane.example.internal
        description: 控制面域名
  - url: http://127.0.0.1:8080
    description: 本地开发（C-11 `TESTPLANE_LISTEN` 默认 `:8080`，明文）

tags:
  - name: health
    description: 运维探针（07 §5.5）
  - name: auth
    description: 当前身份与认证流程（07 §2.4）：`GET /me`、`/auth/login|callback|logout`（认证端点匿名、不带 /api/v1 前缀）
  - name: meta
    description: 平台元信息与特性开关（C-8.2 `GET /meta`，前端版本对齐用）
  - name: runs
    description: Run 提交、列表、详情、取消、报告、事件流、Manifest/部署快照（07 §5.1、§8）
  - name: tasks
    description: Task 列表、详情与取消（07 §5.2、§8）
  - name: attempts
    description: Attempt 只读查询、结果与日志（07 §5.2、C-7.5）
  - name: testers
    description: Tester 目录（07 §5.3、ARCHITECTURE 附录 C）
  - name: clusters
    description: 集群概要（07 §5.3，不返回凭据）
  - name: queue
    description: 队列与槽位可见性（07 §5.3、C-4.7，不读凭据）
  - name: profiles
    description: Execution Profile 与挂载能力（07 §5.3、06 §3，只读）
  - name: artifacts
    description: Run / Attempt 级产物清单（07 §5.1、§5.2、C-7.5）
  - name: files
    description: 产物下载（07 §5.1，支持 Range，不越出 Run 目录）

security:
  # 两种凭据二选一：Cookie 会话（浏览器）或 Bearer JWT（服务间）；RBAC 同一套（07 §2.1）。
  - bearerAuth: []
  - cookieAuth: []

paths:
  # ======================================================================
  # 运维探针（不带版本前缀，无鉴权）
  # ======================================================================
  /healthz:
    get:
      operationId: getHealthz
      summary: 进程存活探针
      description: |
        07 §5.5：进程存活。返回纯文本，K8s liveness 探针直接读状态码。
        开发模式（`--auth=dev`）下会在应答里打印警告（C-10），因此不固定正文内容。
      tags: [health]
      security: []
      responses:
        '200':
          description: 进程存活
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本，内容不作为契约（示例仅示意）
              example: ok

  /readyz:
    get:
      operationId: getReadyz
      summary: 就绪探针（DB + 存储可写 + 迁移版本）
      description: |
        07 §5.5：检查 DB 连接、存储可写、迁移版本一致；**不含 K8s**（K8s 不可达不该摘掉 API 副本）。
        04 (process-view) §DB 不可用：`/readyz` 失败即摘流。
      tags: [health]
      security: []
      responses:
        '200':
          description: 就绪
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/plain:
              schema:
                type: string
                description: 纯文本，内容不作为契约
              example: ok
        '503':
          description: 未就绪（DB 不可用 / 存储不可写 / 迁移版本不一致）；正文给出失败项，供人排查
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/plain:
              schema:
                type: string
                example: storage not writable

  # ======================================================================
  # 身份与元信息
  # ======================================================================
  /api/v1/meta:
    get:
      operationId: getMeta
      summary: 平台元信息（版本 / API 版本 / 特性开关）
      description: |
        C-8.2、07 §5.3：`GET /meta` 返回 `{version, api_version, features}`，供前端做版本对齐与特性开关。
        `api_version` 是 URL 主版本（`v1`，07 §1「URL 主版本」）；`features` 是本实例开启的能力开关，
        客户端只读、不据此推断状态（状态一律以 Run/Task 投影为准）。
      tags: [meta]
      responses:
        '200':
          description: 平台元信息
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/me:
    get:
      operationId: getMe
      summary: 当前用户与角色
      description: |
        07 §2.4 认证端点表、C-8.2：`GET /me` 返回 `{user, role}`。本实例另带两个非核心字段：
        `csrf_token`（UI 写操作双提交用，Bearer 调用方可忽略）与 `groups`（身份源里的组）。
      tags: [auth]
      responses:
        '200':
          description: 当前身份
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ======================================================================
  # Run
  # ======================================================================
  /api/v1/runs:
    post:
      operationId: submitRun
      summary: 提交 Run（YAML 或 JSON Manifest；不做幂等）
      description: |
        07 §4：异步编排，202 表示已受理并落库，后续状态由 SSE 或轮询获取。
        提交校验顺序见 C-5.1（结构 → deploy XOR service → Task 数 ≤200 → Tester/Profile 命中 →
        args 词法切分与公共参数冲突 → on_failure 不得弱化 → env/secrets 引用 → precheck 唯一性 →
        cleanup/timeout 枚举），遇到第一个错误即返回，同一层可聚合多个 issue。

        **不做幂等（D-37）**：每次 POST 都创建新 Run，客户端超时重发即两个 Run；本端点没有幂等键，
        也没有提交指纹或判重逻辑。想避免重复请提交前查 `GET /api/v1/runs?submitter=…`。

        `dry_run=true` 只校验不落库，返回 200 + `DryRunResult`。

        Manifest 可传 YAML 文档或 JSON 对象，两者是同一份结构（07 §1「Manifest 可传 YAML 字符串或 JSON 对象」）。
      tags: [runs]
      parameters:
        - name: dry_run
          in: query
          required: false
          description: '`true` 时只校验、不落库（07 §4.1、C-5.1）'
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        description: |
          Run Manifest（07 §4.1）。顶层是 `run:`，`deploy` 与 `service` 二选一（C-5.1 第 3 条）。
          未知字段忽略（07 §1）；请求体 ≤ 1 MiB，超限 413。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunManifest'
            example:
              run:
                name: qwen3-32b-daily
                deploy:
                  provider: genet
                  parameters:
                    model: Qwen3-32B
                precheck: auto
                env:
                  LOG_LEVEL: info
                secrets:
                  ENDPOINT_API_KEY: endpoint/prod-qwen
                tests:
                  - name: accuracy-a
                    tester: aisbench-acc
                    version: 1.0.0
                    execution:
                      profile: k8s-npu
                    args: --dataset=/data/a
                    on_failure: continue
                cleanup:
                  policy: always
          # YAML 与 JSON 是同一份结构（YAML 1.2 是 JSON 超集），故共用同一个 example：
          # 服务端按 Content-Type 决定用 YAML 还是 JSON 解析，字段语义完全相同。
          application/yaml:
            schema:
              $ref: '#/components/schemas/RunManifest'
            example:
              run:
                name: qwen3-32b-daily
                deploy:
                  provider: genet
                  parameters:
                    model: Qwen3-32B
                precheck: auto
                tests:
                  - name: accuracy-a
                    tester: aisbench-acc
                    version: 1.0.0
                    execution:
                      profile: k8s-npu
                    args: --dataset=/data/a
                    on_failure: continue
      responses:
        '200':
          description: dry-run 结果（只校验，不落库）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DryRunResult'
        '202':
          description: 已受理并落库（07 §4.2）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      operationId: listRuns
      summary: Run 列表（游标分页，按提交时间倒序）
      description: |
        07 §5.1、§6：过滤 `status`、`kind`、`tester`、`submitter`；游标编码 `(submitted_at, id)` 倒序，
        客户端只回传不解析；**排序固定**，没有 `sort` 参数（07 §6「排序固定为提交时间倒序」）。
        未知过滤字段返回 400（07 §6）。多值过滤用逗号：`status=testing,deploying`。
      tags: [runs]
      parameters:
        - name: status
          in: query
          required: false
          description: 多值，逗号分隔（`status=testing,deploying`）；取值见 `RunStatus`
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RunStatus'
        - name: kind
          in: query
          required: false
          description: '`run` 普通 Run；`task` 独立 Task 合成的占位 Run（03 §3.2）'
          schema:
            $ref: '#/components/schemas/RunKind'
        - name: tester
          in: query
          required: false
          description: Tester 名称；返回包含该 Tester Task 的 Run
          schema:
            type: string
        - name: submitter
          in: query
          required: false
          description: 提交者（`runs.submitted_by`，身份源 subject）
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Run 列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Run 详情（含 Task 摘要）
      description: |
        07 §5.1：详情 + Task 摘要。03 §10 要求用**一条 JOIN** 取 Task 摘要，禁止 N+1，
        故 `tasks[]` 是摘要形态（`TaskSummary`，含 `attempts` 计数），完整字段走 `GET /api/v1/tasks/{task_id}`。
      tags: [runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run 详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: 取消 Run（含 Deploy 排队阶段）
      description: |
        07 §5.1、§8、C-6.1：前置条件为**非终态**；CAS 到 `cancelling` 后异步收口。
        重复调用语义（07 §8）：已是 `cancelling` / `canceled` 时返回 **200** 且状态不变，否则 **202**。
        取消与自然结束竞态：以先落库状态为准，客户端以 SSE 推送为最终结果，不做乐观更新。
        `If-Match` 为可选乐观锁（07 §1），版本不匹配返回 409 `CONFLICT`。
      tags: [runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已受理取消，状态为 `cancelling`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAccepted'
        '200':
          description: 已经是 `cancelling` / `canceled`，幂等回同一状态（07 §8）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/runs/{run_id}/report:
    get:
      operationId: getRunReport
      summary: Run 汇总报告（report.json）
      description: |
        07 §5.1、C-7.2：返回 Run 的 `report.json`，结构见 ARCHITECTURE §8.4——只做组织与索引，
        不对指标做聚合。报告由 `run.finished` 后异步生成；**文件尚未生成时返回 404 + `Retry-After`**（C-7.2）。
        单 Run 报告 > 20 MiB 时返回摘要（`truncated: true` + `report_ref`）。
      tags: [runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run 报告
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReportNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{run_id}/report.md:
    get:
      operationId: getRunReportMarkdown
      summary: Run 报告的人可读摘要（text/markdown）
      description: |
        C-8.2、ARCHITECTURE §8.2：`report.md` 由平台在 `run.finished` 后与 `report.json` 一同生成，
        是人类可读摘要。与 `report.json` 一致：**文件尚未生成时返回 404 + `Retry-After`**（C-7.2）。

        正文是 Markdown 原文，平台不做 HTML 渲染——渲染在 UI 侧完成，须按不可信文本处理（Tester 自述内容）。
      tags: [runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Markdown 报告
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/markdown:
              schema:
                type: string
                description: Markdown 原文
              example: |
                # r-20261105-0001 · qwen3-32b-daily

                - 状态：completed_with_errors
                - Task：4（成功 2 / 失败 1 / 跳过 1）

                ## 失败

                - t-0002 accuracy-dataset-b：TESTER_NONZERO_EXIT
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ReportNotReady'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{run_id}/events:
    get:
      operationId: streamRunEvents
      summary: Run 事件流（SSE，支持 Last-Event-ID 回放）
      description: |
        07 §7、C-9.2。客户端用 fetch + ReadableStream（不用原生 EventSource）以便带头与处理 401/429。

        帧格式：
        ```text
        id: 43
        event: task.state_changed
        data: {"seq":43,"type":"task.state_changed","run_id":"r-…","task_id":"t-0002","at":"…","payload":{"from":"queued","to":"preparing"}}
        ```

        事件类型（07 §7）：`run.submitted`、`run.state_changed`、`task.state_changed`、`attempt.started`、
        `attempt.finished`、`deploy.state_changed`、`cleanup.started`、`run.finished`、`report.written`、
        `resync_required`。

        规则：从 `Last-Event-ID + 1` 回放；窗口 24h、单次 ≤1000 条，越窗先发 `event: resync_required`
        （客户端整页重建）；心跳 15s 一行 `: ping`；60s 无事件或客户端断开即释放；同一用户同一 Run 的
        并发连接有上限，超限 429；只发状态事实，不发日志正文、不发凭据。
      tags: [runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: Last-Event-ID
          in: header
          required: false
          description: 上一次收到的事件 `seq`；缺省表示不回放（只推实时事件）
          schema:
            type: string
      responses:
        '200':
          description: 事件流（长连接）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧文本；`data` 为事件对象 JSON
              example: |
                id: 43
                event: task.state_changed
                data: {"seq":43,"type":"task.state_changed","run_id":"r-20261105-0001","task_id":"t-0002","at":"2026-11-05T01:00:09Z","payload":{"from":"queued","to":"preparing"}}

                : ping
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/runs/{run_id}/events/history:
    get:
      operationId: listRunEvents
      summary: Run 事件历史（JSON，供时间线首屏与断线补齐）
      description: |
        C-8.2、07 §5.1：与 SSE 同一份事件事实流（`state_events`，03 §3.2），用 JSON 拉取，供详情页右栏
        时间线首屏与断线补齐。`seq` 在同一 Run 内单调且唯一（`state_events_seq_uq`），客户端按 `seq` 去重。

        窗口与 SSE 一致：24h（`TESTPLANE_SSE_REPLAY_HOURS`）、单次 ≤1000 条（C-9.2）。越窗不静默截断——
        SSE 侧发 `resync_required`，本端点因 `since_seq` 明确指向序号，直接按库中现存行返回。
      tags: [runs]
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: since_seq
          in: query
          required: false
          description: 只返回 `seq > since_seq` 的事件；缺省 `0`（从头取，受 24h 窗口约束）
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: 本次返回条数，默认 200、上限 1000（C-9.2 单次回放上限）
          schema:
            type: integer
            default: 200
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: 事件历史（按 `seq` 升序）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/runs/{run_id}/tasks:
    get:
      operationId: listRunTasks
      summary: 某 Run 的 Task 列表（按 seq 升序，游标分页）
      description: |
        07 §5.1、§6：Task 列表按 `run_id, seq` 排序（07 §6「Task 列表按 run_id, seq」），`seq=0` 是平台
        注入的 Pre-Check。
