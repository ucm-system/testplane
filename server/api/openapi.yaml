        - name: tester
          in: query
          required: false
          description: Tester 名称（`tasks.tester_name`，冻结快照，注册表变化不影响）
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
