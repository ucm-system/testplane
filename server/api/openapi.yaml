  /api/v1/tasks/{task_id}/cancel:
    post:
      operationId: cancelTask
      summary: 取消单个 Task
      description: |
        07 §5.2、§8：前置为非终态，202 表示已受理取消。重复调用语义与 Run 一致（07 §8「同上」）：
        已处于取消中/已取消时返回 200 且状态不变。未开始的 Task 落 `skipped(status_reason=canceled)`，
        已拿到槽位/已启动的落 `canceled`（I-13 G-1）；`cancel_requested` 置位后由 executor 异步删 Job，
        不阻塞状态推进（03 §3.1）。`tasks` 没有 `revision` 列，故本端点不接受 `If-Match`。
      tags: [tasks]
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已受理取消
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCancelAccepted'
        '200':
          description: 已经是取消中/已取消，幂等回同一状态（07 §8）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCancelAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/tasks/{task_id}/attempts:
    get:
      operationId: listTaskAttempts
      summary: 某 Task 的 Attempt 列表（按 idx 升序）
      description: |
        07 §5.2：Attempt 列表。03 §3.1：`(task_id, idx)` 唯一，`idx` 从 1 连续；历史 Attempt 不被覆盖。
      tags: [attempts]
      parameters:
        - $ref: '#/components/parameters/TaskId'
