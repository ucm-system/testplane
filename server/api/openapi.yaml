  /api/v1/tasks/{task_id}/runners/{seq}/result:
    get:
      operationId: getTaskRunnerResult
      summary: runner 的 result.json（缺省最新 attempt）
      description: |
        07 §5.2、ARCHITECTURE 附录 A（schema 2.0）：返回该 runner 的机器可读结果 `result.json` 原文。
        平台只校验不收窄字段（「字段不限制，Runner 自维护」），故 `Result` 允许任意未知字段。

        **产物三选一（D-74）**：test / pre_check 的 runner 产出 `result.json` / `result.html` /
        `result.csv` 至少其一，不强求 `result.json`。本端点只服务 `result.json`：

        - Runner 未产出 `result.json`（只产出 `result.html` / `result.csv`）→ 404，
          `detail.produced[]` 列出实际落档产物（html / csv 由前端经 `/artifacts` + `/files` 通用展示，平台不解析）；
        - 退出码 0 但三选一全部缺失 → runner 判 `RESULT_MISSING`（C-7.1），本端点 404；
        - `result.json` 产出但不合法（不符合附录 A）→ 判 `RESULT_INVALID`（仅此情形适用），本端点 404。

        `FAILED` 的 runner 也可能有可读结果（ARCHITECTURE §8.5「部分结果必须可以单独获取」）。
        deploy / clean 角色无结果产物（404）。
