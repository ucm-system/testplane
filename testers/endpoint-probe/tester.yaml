name: endpoint-probe
version: 1.0.0
display_name: 服务就绪探测
description: |
  对已部署的 LLM 服务执行生成型探活：POST <url>/chat/completions，max_tokens=1、stream=true，
  首包 token 一到即判定可服务，避免慢模型/长思考模型「等到 EOS 才返回」被误判为未就绪。
  只回答「服务此刻能不能出字」；部署是否 ready/blocked 由 Genet 与平台 Deploy 阶段负责。

role: pre_check

# 本 Tester 失败时必须终止整个 Run（§8.3）：探活没过，后面所有测试都没有意义。
# 平台据此把 PENDING/QUEUED 的 Task 标 SKIPPED、把正在跑的 CANCELED。
# role: pre_check 必须声明这一条，注册校验会拒绝没有声明的（§5.6）。
on_failure: abort_run

entry: /tester/run.sh

# 镜像由 CI 构建产出（见 build/Dockerfile 与 README 的构建节）。平台与任何运行环境都不 build（§6.2）。
# 镜像引用形态不限（tag / digest 都行）：平台原样交给 K8s，不做解析也不强制钉版本（§5.6）。
image: registry.dev.huawei.com/testplane/endpoint-probe:1.0.0

resources:
  cpu: "1"
  memory: "256Mi"
  gpu: { resource: nvidia.com/gpu, count: 0 }

# 必须独占该 Endpoint（§6.7、§7.2）：
#   1. 探活发的是真实 /chat/completions 请求，会和同时进行的性能测量互相污染；
#   2. 它是正式测试的前置门，探活没通过之前同 Endpoint 上不允许跑任何测试。
concurrency:
  endpoint_exclusive: true

mounts: []

# 参数清单：仅供 Agent 与人类阅读，平台不渲染、不校验。
# url / model_name / model_path 是公共参数保留字，所有 Tester 保持相同含义。
# 「谁给值」取决于场景（见下方 url 描述），不用字段表达——静态字段写不准这件事。
#
# 本 Tester 不声明超时与产物：超时由平台/调用方决定，产物契约全局统一（§5.3、§6.6）。

placeholder: "--url=http://10.0.0.10:8000/v1 --model_name=Qwen3-32B"

parameters:

  url:
    type: string
    required: true
    description: |
      OpenAI 兼容的 base URL，形如 http://host:8000/v1；不带 /v1 会自动补，末尾斜杠忽略。
      Tester 从它推导 /chat/completions 与 /models 两个端点。
      谁给值取决于场景：Run 里有 deploy 时平台注入；跑已有服务（不拉服务）时由调用方填写；
      脱离平台独立运行时由调用方填写。三种场景下都必须有一个有效值，没有则以非 0 退出码失败（平台只区分 0 / 非 0）。

  model_name:
    type: string
    description: |
      服务端模型名，即请求体里 model 字段的取值。来源同上（平台注入或调用方填写）。
      未提供时 Tester 会 GET <url>/models 取第一个可用模型，
      并在日志与 result.json.workload.model_source 中标注来源。

  wait_timeout_seconds:
    type: integer
    description: "就绪等待总窗口（秒），0 表示只探一次。常规服务 600；PD 分离或慢模型加载可到 18000。该窗口由本 Tester 内部消化，平台不另建 Attempt（§7.2）。"
    default: "600"

  retry_interval_seconds:
    type: integer
    description: "两次探测之间的间隔（秒），必须 >= 1。"
    default: "15"

  max_tokens:
    type: integer
    description: "探活请求的 max_tokens，默认 1。不要调大——调大等于发一次真实生成请求，慢模型会被误判未就绪。"
    default: "1"

  stream:
    type: boolean
    description: "是否流式探活。true（推荐）时首 token 到达即通过；false 时要求 choices[0].message.content 非空。"
    default: "true"

# 运行期读取的环境变量（§12.4）。这里是**声明**，不是绑定：
# 值由 Run 级 secrets 注入（submission 时填一次，该 Run 下所有 Task 共用）。
env:
  ENDPOINT_API_KEY:
    required: false          # 探活不强制鉴权：服务的 /chat/completions 可能不需要 token
    secret: true
    description: "Bearer token，用于 Authorization 头；不提供时按无鉴权探测"
