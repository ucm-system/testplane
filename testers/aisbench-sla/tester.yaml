name: aisbench-sla
version: 0.3.0
display_name: AISBench 前缀缓存 SLA 搜索
description: |
  用前缀缓存 SLA 搜索找出「满足延迟约束的最大并发」与「最高输出吞吐」。
  预检（并发=1）→ 指数阶梯（×2）→ 二分收敛，每条 SLA 约束是「指标.统计量:阈值」，多条 AND 生效；
  逐点写 ais_bench 配置并调用 ais_bench 压测，命中率按目标服务 /metrics 快照差分给出（只作证据，不参与判定）。
  只回答「这套服务在给定负载形态下能扛到几并发、吞吐多少」；是否达标由下游消费指标判断。

  0.2.0 起镜像基于官方 AISBench benchmark 镜像（ghcr.io/aisbench/aisbench_benchmark，
  3.1.20260330 / py310），`ais_bench` 是真命令；stub 仍留在镜像里仅供离线回归
  （`--aisbench_cmd=/tester/tool/tests/stub_aisbench.py`）。

role: test

# 单个并发点失败（服务抖动、单点超时）不应终止整个 Run：SLA 搜索本身会把该点记为 FAIL 并继续收敛。
# 只有 Pre-Check（endpoint-probe）才 abort_run（§7.3）。
on_failure: continue

entry: /tester/run.sh

# 镜像由 CI 构建产出（见 build/Dockerfile 与 README 的构建节）。平台与任何运行环境都不 build（§6.2）。
# 0.2.0 = 真实 ais_bench 模式：build/Dockerfile.aisbench（基础镜像自带 ais_bench 3.1.20260330）。
image: ghcr.io/ucm-system/testplane-tester-aisbench-sla:0.3.0

resources:
  cpu: "2"
  memory: "2Gi"
  gpu: { resource: nvidia.com/gpu, count: 0 }

# 必须独占该 Endpoint（§6.7）：本工具会按并发阶梯持续打满目标服务，
# 与任何其他测量并行都会互相污染（吞吐被摊薄、延迟被抬高，结论不可用）。
concurrency:
  endpoint_exclusive: true

# 数据集与权重都不由平台托管（§10.4）：路径是不透明字符串。
# 本 Tester 不向平台声明挂载点，是因为需要哪个共享存储、挂到容器内什么路径，取决于
# Execution Profile 提供的挂载能力与调用方约定的容器内路径；声明成固定 mount_path 反而会
# 把某个 Profile 的目录布局写死。需要时请由 Profile 挂载，并在 args 里给出容器内绝对路径：
#   --model_path=/models/Qwen3-32B        （tokenizer/权重，工具要求它存在，生成数据集时用）
#   --dataset_path=/data/sla_datasets     （生成的前缀数据集落盘目录，可写）
#   --dataset=/data/gsm8k/test.jsonl      （现成数据集，跳过生成、跳过 tokenizer）
# 离线冒烟（镜像自带桩）用 --dataset=/tester/fixtures/smoke_dataset.jsonl + --work_path=/tester/tool。
mounts: []

# 参数清单：仅供 Agent 与人类阅读，平台不渲染、不校验（§5.4）。
# url / model_name / model_path 是公共参数保留字，所有 Tester 保持相同含义（§5.4.1）。
# 本 Tester 不声明超时与产物：超时由平台/调用方决定，产物契约全局统一（§5.3、§6.6）。

placeholder: |
  --input_len=2048 --output_len=32 --data_num=160 --sla=ttft.avg:1200 --sla=tpot.avg:30 \
  --start=8 --max=256 --max_probes=12 --request_rate=0 \
  --dataset_type=prefix_cache --prefix_num=1 --repeat_rate=90% \
  --work_path=/tmp/aisbench-ws --dataset_path=/workspace/output/sla_out/datasets
  url 是 OpenAI 兼容的 base URL：形如 http://host:8000/v1；Tester 会去掉末尾 /v1 再交给工具
  （工具要的是服务根地址，自己拼 /v1/models 与 ais_bench 的 url 字段）。
  work_path **不要**写 /benchmark：平台 Job 的根文件系统只读，/benchmark 属 root 不可写；
  0.2.0 的 run.sh 会用 AIS_BENCH_DATASETS_CACHE + --config-dir 把 /tmp 下的影子源码根接给 ais_bench。

parameters:

  url:
    type: string
    required: true
    description: |
      OpenAI 兼容的 base URL，形如 http://host:8000/v1；末尾斜杠忽略。
      Tester 会**去掉末尾的 /v1** 再作为工具的 --target：工具用服务根地址拼 /v1/models 与
      ais_bench 的 url 字段，直接传带 /v1 的地址会变成 .../v1/v1/chat/completions。
      谁给值取决于场景：Run 里有 deploy 时平台注入；跑已有服务（不拉服务）时由调用方填写；
      脱离平台独立运行时由调用方填写。没有值本 Tester 退出码 2。

  model_name:
    type: string
    description: |
      服务端模型名，即 OpenAI 兼容接口与 ais_bench 模型配置里 model 字段的取值。
      来源同上（平台注入或调用方填写）。

  model_path:
    type: string
    description: |
      容器内 tokenizer/权重路径。工具的 ais_bench 模型配置必须带它（报错 UTILS-FILE-002），
      且工具会校验该目录真实存在。生成前缀数据集时要读 tokenizer；用现成 --dataset 时不读，
      但路径仍需存在。由 Profile 挂载提供，平台不改写（§10.4）。
      **验证用 0.2.0 镜像自带** `/models/Qwen3-0.6B`（15MB tokenizer，仅本地/kind 验证镜像有，
      生产镜像不带，靠 Profile 挂载）——所以本机验证时 service.model_path 写 /models/Qwen3-0.6B。
      注意它是**公共参数**（§5.4.1），只能在 manifest 的 service.model_path 给，不能写进 args。

  input_len:
    type: integer
    description: "输入 token 长度（生成前缀数据集的目标长度）。默认 2048；长上下文很贵，可用 --length_* 变长。"
    default: "2048"

  output_len:
    type: integer
    description: "输出 token 长度（ais_bench max_out_len）。默认 32；压吞吐时通常取 128~1024。"
    default: "32"

  data_num:
    type: integer
    description: "数据集条数（每点压测的请求数）。默认 64；建议取 --max 的 2~4 倍且 >= --max，否则最高并发点压不满、吞吐被低估。注意：显式给 `--dataset` 时本参数不生效（截断只发生在生成数据集的路径里，已有数据集原样使用）。"
    default: "64"

  sla:
    type: array
    required: true
    description: |
      SLA 约束，可重复、多条 AND 生效。语法 `<指标>.<统计量>:<阈值>`，分隔符 . _ - 均可，阈值可用 : 或 =。
      指标：ttft / tpot / e2e / output_throughput；统计量：avg/min/max/median/p50/p75/p90/p99（吞吐为下限语义）。
      延迟单位 ms，吞吐单位 tok/s。至少一条：没有约束时工具会以参数错误退出。
    example: "ttft.avg:1200"
    required_for: "所有 SLA 搜索调用"

  start:
    type: integer
    description: "起始并发。默认 1；> 1 时先在并发=1 做预检，预检不达标直接判「阈值与能力矛盾」（退出码 2）。"
    default: "1"

  max:
    type: integer
    description: "并发上限。默认 256；阶梯从 --start 起每次 ×2，到上限仍达标则状态 max_unbounded（仍算成功）。"
    default: "256"

  max_probes:
    type: integer
    description: "探测点数预算。默认 20；预算用尽即停止搜索（结论取已跑点里的最大可行并发）。"
    default: "20"

  tolerance:
    type: integer
    description: "二分收敛容差（并发数）。默认 1；区间宽度 <= max(tolerance, lo//8) 时停止二分。"
    default: "1"

  max_bisect:
    type: integer
    description: "二分最大迭代次数。默认 5；0 表示只做阶梯不二分。"
    default: "5"

  request_rate:
    type: number
    description: "请求频率（RPS，写进 ais_bench 模型配置的 request_rate）。默认 3；0 = 不限速。频率 × 时延 < 目标并发时瓶颈会变成频率，实测并发（measured_concurrency）明显偏低——要测并发上限就设 0。"
    default: "3"

  dataset_type:
    type: string
    description: "数据集形态。prefix_cache（默认）= 公共前缀 + 3 个随机 token + 后缀，用于前缀缓存命中场景；normal = 普通数据集（不带公共前缀）。"
    default: "prefix_cache"

  prefix_num:
    type: integer
    description: "前缀种类数（dp 域数量 > 1 时每域一份）。默认 1。"
    default: "1"

  repeat_rate:
    type: string
    description: "前缀重复率，支持 90% 或 0.9。默认 90%；决定每条请求有多少比例的 token 可以命中 KV cache。"
    default: "90%"

  seed:
    type: integer
    description: "随机种子。默认 1；每个探测点实际用 seed+i（--seed_per_point 默认开），各点前缀互不相同、命中率可比。"
    default: "1"

  dp:
    type: integer
    description: "dp 域数量（预热阶段并发取它）。默认 1；PD 分离或数据并行服务按实际 P 节点数填。"
    default: "1"

  dataset:
    type: string
    description: |
      现成数据集 jsonl（gsm8k 格式，每行 {"question":...}）的容器内绝对路径。给了就跳过生成，也不再需要
      tokenizer。注意：工具在「每点换 seed」默认模式下会**忽略** --dataset 去重新生成，所以本 Tester 在
      给了 --dataset 时自动关闭每点换 seed（各点复用同一份数据集，命中率会逐点饱和）。
      离线冒烟用 /tester/fixtures/smoke_dataset.jsonl。
    example: "/tester/fixtures/smoke_dataset.jsonl"

  dataset_path:
    type: string
    description: "生成的数据集落盘目录（容器内绝对路径，需可写）。默认 <output>/sla_out/datasets；长上下文场景建议指到挂载的共享存储，便于跨 Attempt 复用。"
    example: "/data/sla_datasets"

  work_path:
    type: string
    required: true
    description: |
      ais_bench 的「工作根」（本 Tester 会往它下面写
      ais_bench/benchmark/configs/models/vllm_api/vllm_api_chat_temp.py 与数据集目录），必须可写；
      目录不存在时 Tester 会 mkdir -p。
      **默认写 /tmp/aisbench-ws，不要写 /benchmark**：官方镜像里 /benchmark 是 ais_bench 源码根、
      属 root 0755 不可写；平台 Job 又是 ReadOnlyRootFilesystem，只有 /workspace/output 与 /tmp 可写。
      run.sh 会自动做两处接线，让 /tmp 下的影子源码根被 ais_bench 认到：
      `AIS_BENCH_DATASETS_CACHE=<work_path>`（数据集相对路径锚点）与
      `--config-dir <work_path>/ais_bench/benchmark/configs`（模型配置搜索路径）。
      指 /benchmark 时按原生路径工作（需要该目录可写，仅脱离平台的本地调试有意义）。
    example: "/tmp/aisbench-ws"
    required_for: "所有真实 ais_bench 调用"

  aisbench_cmd:
    type: string
    description: "替换 ais_bench 命令（可带参数，按 shell 解析）。默认 ais_bench（0.2.0 起是真命令）；离线回归填 /tester/tool/tests/stub_aisbench.py 或 'python3 /tester/tool/tests/stub_aisbench.py'（前者要求可执行位，镜像已给）。"
    default: "ais_bench"
    example: "/tester/tool/tests/stub_aisbench.py"

  aisbench_extra_args:
    type: string
    description: "追加到 ais_bench 命令末尾的原始参数串（按 shell 解析）。默认空；用于透传本 Tester 未建模的 ais_bench 开关。"
    default: ""

  point_timeout:
    type: number
    description: "单个探测点（含预热阶段）的超时秒数，超时终止进程树并把该点判 FAIL。默认 0 = 不限；长上下文建议 1800。"
    default: "0"

  prefix_warmup:
    type: string
    description: "前缀预热时机。per-point（默认）每点预热；once 只首点预热；none 不预热（此时命中率偏低，结论只反映冷缓存）。"
    default: "per-point"

  no_stream:
    type: boolean
    description: "true 时不在 stdout 实时打印 ais_bench 输出（仍逐点落盘到 sla_out/points/**）。默认 false；日志量大时建议 true。"
    default: "false"

# 运行期读取的环境变量（§12.4）：只声明，不绑定；平台上由 Run 级 secrets 注入。
# 凭据只走环境变量，不进 argv（§12.4）。
env:
  ENDPOINT_API_KEY:
    required: false
    secret: true
    description: "Bearer token，用于目标服务鉴权（/v1/models、/metrics、ais_bench 模型配置的 api_key）；不提供时按无鉴权压测"
