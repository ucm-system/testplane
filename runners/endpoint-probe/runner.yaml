name: endpoint-probe
version: 1.0.3
display_name: 服务就绪探测
description: |
  对已部署的 LLM 服务执行生成型探活：POST <url>/chat/completions，max_tokens=1、stream=true，
  首包 token 一到即判定可服务，避免慢模型/长思考模型「等到 EOS 才返回」被误判为未就绪。
  只回答「服务此刻能不能出字」；部署是否 ready/blocked 由内置 service-deploy runner 与 Genet 负责（§9）。
  输入要点：url / model_name 不在输入文件里——由平台以 AG_SERVED_URL / AG_SERVED_MODEL_NAME
  注入；探活路径由本 Runner 自行拼 /chat/completions 与 /models，不单独暴露 path 参数。
  1.0.3 起 placeholder 收敛为单行合法 JSONL（跨行美化 JSON 复制/填示例即报行号错误，D-67）。

role: pre_check

# 本 Runner 失败时必须终止整个 Task（§7.3）：探活没过，后面所有 runner 都没有意义。
# 平台据此把未开始的 runner 标 SKIPPED、把正在跑的 CANCELED。
# role: pre_check 必须声明 abort_task，注册校验会拒绝其他取值（§5.6）。
on_failure: abort_task

entry: ["/runner/run.sh"]
input_format: jsonl

# ⚠ 非契约字段（用户实验性扩展，v2 契约未定义 pre_check/post_run；是否保留待定）。
# 保留原样以便回滚；平台注册器目前会忽略它们。路径已随 /tester/ → /runner/ 同步。
pre_check: /runner/pre_check.sh
post_run: /runner/post_run.sh

# 镜像由 CI 构建产出（见 build/Dockerfile 与 README 的构建节）。平台与任何运行环境都不 build（§6.2）。
# 镜像引用形态不限（tag / digest 都行）：平台原样交给 K8s，不做解析也不强制钉版本（§5.6）。
image: registry.dev.huawei.com/argus/endpoint-probe:1.0.2

resources:
  cpu: "1"
  memory: "256Mi"
  gpu: { resource: nvidia.com/gpu, count: 0 }

# 必须独占该服务（§6.7）：
#   1. 探活发的是真实 /chat/completions 请求，会和同时进行的性能测量互相污染；
#   2. 它是正式测试的前置门，探活没通过之前同一服务上不允许跑任何测试。
#   （v2：Task 内 runner 严格串行，本字段仅在外接模式仍可能有并行测量时生效。）
concurrency:
  endpoint_exclusive: true

mounts: []

# 本 Runner 不产出下游 key（pre_check 无导出，§5.12）。
exports: []
# 被测服务地址与模型名由平台以公共参数环境变量注入（§5.4.1）：
#   AG_SERVED_URL / AG_SERVED_MODEL_NAME（外接模式来自 Manifest service 块，部署模式来自 deploy 导出）。
consumes: [AG_SERVED_URL, AG_SERVED_MODEL_NAME]

# 业务参数 schema（jsonl，§5.4）：平台校验类型与 required 存在性；
# 范围/枚举/跨字段语义仍归本 Runner。url / model_name 是公共参数（§5.4.1），
# 走 AG_SERVED_URL / AG_SERVED_MODEL_NAME 环境变量，**不进参数文件**。
#
# 本 Runner 不声明超时与产物：超时由平台/调用方决定；产物契约三选一（D-74：result.json/html/csv 至少其一，本 Runner 产出 result.json），全局统一见 §5.3、§6.6。

# placeholder 必须与 input_format 同格式（D-67）：jsonl = 单行完整 JSON 对象。
placeholder: '{"wait_timeout_seconds":600,"retry_interval_seconds":15,"max_tokens":1,"stream":true}'

parameters:
  - name: wait_timeout_seconds
    type: integer
    required: false
    default: 600
    description: "就绪等待总窗口（秒），0 表示只探一次。常规服务 600；PD 分离或慢模型加载可到 18000。该窗口由本 Runner 内部消化，不与 Task 级重试混用（§5.11、§7.8）。"

  - name: retry_interval_seconds
    type: integer
    required: false
    default: 15
    description: "两次探测之间的间隔（秒），必须 >= 1。"

  - name: max_tokens
    type: integer
    required: false
    default: 1
    description: "探活请求的 max_tokens，默认 1。不要调大——调大等于发一次真实生成请求，慢模型会被误判未就绪。"

  - name: stream
    type: boolean
    required: false
    default: true
    description: "是否流式探活。true（推荐）时首 token 到达即通过；false 时要求 choices[0].message.content 非空。"

# 运行期读取的环境变量（§12.4）。这里是**声明**，不是绑定：
# 值由 Task 级 secrets 注入（提交时填一次，该 Task 下共用）。
env:
  ENDPOINT_API_KEY:
    required: false          # 探活不强制鉴权：服务的 /chat/completions 可能不需要 token
    secret: true
    description: "Bearer token，用于 Authorization 头；不提供时按无鉴权探测"
