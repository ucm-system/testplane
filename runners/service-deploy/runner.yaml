name: service-deploy
version: 1.0.0
display_name: 服务部署（内置）
description: |
  内置 deploy Runner：读取 Genet 部署描述（params.yaml，语义原样透传，平台不解析），
  经 Genet OpenAPI 以确定性 releaseName 幂等拉起 Helm release（noWait=true），
  轮询部署状态并周期原子改写 $AG_OUTPUT_DIR/deploy-state.json（temp+rename）；
  服务就绪（helm release deployed 且 callInfo.endpoint.status=ready，两根轴，D-45）后
  导出 AG_SERVED_URL / AG_SERVED_MODEL_NAME / AG_MODEL_PATH / AG_DEPLOY_REF 四件套。
  失败在 deploy-state.json 写明归类（DEPLOY_BLOCKED / DEPLOY_FAILED）后按退出码表达（§9.3）。
  平台只读 deploy-state.json 与 exports，不直连 Genet（D-70）。

role: deploy                    # 仅内置：用户目录声明 role: deploy 一律拒绝注册（§5.1）
on_failure: abort_task          # 内置 deploy 必须声明（§7.3 / 注册校验强制）

entry: ["/runner/run.sh"]       # exec form 数组；平台 exec 该数组、不经 shell、不追加 argv（§5.2）
input_format: yaml              # 部署描述原文落盘 params.yaml；平台只做语法级校验（§5.4）

# 镜像由 CI 构建产出（build/Dockerfile 与 README 构建节；§6.2）。平台不 build、不解析形态（§5.6）。
# 本地联调 tag：argus-service-deploy:dev（见 run-local.sh）。
image: registry.dev.huawei.com/argus/service-deploy:1.0.0

resources:
  cpu: "1"                      # 只调 Genet OpenAPI 轮询，不消耗加速卡
  memory: "256Mi"
  gpu: { resource: nvidia.com/gpu, count: 0 }

# deploy 阶段被测服务尚不存在，无从独占（§6.7；endpoint_exclusive 仅外接模式有效）。
concurrency:
  endpoint_exclusive: false

mounts: []

# 内置导出契约（§5.12）：service-deploy 必须导出四件套。
exports: [AG_SERVED_URL, AG_SERVED_MODEL_NAME, AG_MODEL_PATH, AG_DEPLOY_REF]
consumes: []

# input_format: yaml → parameters 必须为 []（附录 C / 注册校验 #12）；部署描述语义完全归本 Runner 与 Genet。
parameters: []

# 与 input_format 同格式的合法片段（§5.4），UI 输入框占位。
# 说明：整个文件原文作为 Genet 的 values 透传；package_type / template_path /
# model / model_path 是本 Runner 识别的少量展示与路由字段（不修改、仅读取）。
placeholder: |
  # Genet 部署描述（原文透传为 UcStackInstallRequest.values；values 不能全空）
  replicaCount: 1
  model: Qwen3-32B
  model_path: /models/Qwen3-32B
  package_type: stack        # stack | pd（缺省 stack，D-53：本地/CI 一律 stack）
  # template_path: charts/xxx  # 可选；values / templatePath / templateId 不能全空

# 运行期读取的环境变量（§12.4）。这里是声明，不是绑定：值由平台注入（AG_GENET_BASE_URL /
# AG_DEPLOY_* 走 Task 级 env 或平台配置；GENET_API_KEY 走 Task 级 secrets，§12.2 / D-72）。
env:
  AG_GENET_BASE_URL:
    required: true
    secret: false
    description: "Genet OpenAPI 基地址（如 http://genet-backend.genet.svc:8080 或 genet-local 地址）。缺失时本 Runner 以退出码 2 失败。"
  GENET_API_KEY:
    required: true
    secret: true
    description: "Genet Open API Key（Bearer，scope read/write），由 API Key 绑定的 namespace 决定服务落地 ns。由 Task 级 secrets 注入；Runner 只读不打印（§12.4）。"
  AG_DEPLOY_TIMEOUT:
    required: false
    secret: false
    description: "部署总窗口（秒），缺省 259200（72h，K-6）。排队计入窗口；超窗写 failure{code:DEPLOY_FAILED, reason:timeout} 并退出 1。"
  AG_DEPLOY_POLL_FAST_INTERVAL:
    required: false
    secret: false
    description: "快速轮询间隔（秒），缺省 2。"
  AG_DEPLOY_POLL_FAST_WINDOW:
    required: false
    secret: false
    description: "快速轮询窗口（秒），缺省 30；之后按指数退避到 AG_DEPLOY_POLL_SLOW_INTERVAL。"
  AG_DEPLOY_POLL_SLOW_INTERVAL:
    required: false
    secret: false
    description: "退避间隔上限（秒），缺省 15。"
  AG_DEPLOY_POLL_NOTFOUND_GRACE:
    required: false
    secret: false
    description: "POST 受理后 GET 404 的宽限窗（秒），缺省 180（release 异步 apply 未可见，execution §9.2）。"
