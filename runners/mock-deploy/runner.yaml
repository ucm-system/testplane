name: mock-deploy
version: 1.1.0
display_name: Mock 服务接入（内置）
description: |
  内置 deploy Runner（mock 变体，D-75）：**与 Genet 完全解耦**——不做任何部署动作，
  只「接入」一个已存在的 OpenAI 兼容 mock 服务并等它就绪。联调环境缺省接入 chart
  内置的 mock-llm（tools/mock-llm，常驻共享服务）；base_url 参数可指向任何
  OpenAI 兼容端点。就绪后写 deploy-state（phase=ready）并导出四件套。
  可用性由 pre_check runner 判定（§9.1）。

  本 Runner 从不创建集群对象（无 Helm release、无 Pod），因此 clean 阶段不注入
  （不声明 clean_runner，与 existing-deploy 同理）；超窗未就绪收口为
  DEPLOY_BLOCKED(reason=timeout)（D-47）。

role: deploy                    # 仅内置：用户目录声明 role: deploy 一律拒绝注册（§5.1）
on_failure: abort_task          # 内置 deploy 必须声明（§7.3 / 注册校验强制）

entry: ["/runner/run.sh"]       # exec form 数组；平台 exec 该数组、不经 shell、不追加 argv（§5.2）
input_format: jsonl             # 接入参数以 JSON 行传入（缺省全空 = 接内置 mock-llm）

# 镜像由 CI 构建产出（build/Dockerfile，§6.2）。
# 本地联调 tag：argus-mock-deploy:dev（见 build/Dockerfile 构建节）。
image: registry.dev.huawei.com/argus/mock-deploy:1.1.0

resources:
  cpu: "100m"                   # 只做就绪探测轮询，不消耗加速卡
  memory: "64Mi"
  gpu: { resource: nvidia.com/gpu, count: 0 }

# deploy 阶段被测服务尚不存在，无从独占（§6.7；endpoint_exclusive 仅外接模式有效）。
concurrency:
  endpoint_exclusive: false

mounts: []

# 内置导出契约（§5.12）：deploy runner 必须导出四件套（与 genet-deploy / existing-deploy 相同）。
exports: [AG_SERVED_URL, AG_SERVED_MODEL_NAME, AG_MODEL_PATH, AG_DEPLOY_REF]
consumes: []

parameters:
  - name: base_url
    type: string
    required: false
    description: "OpenAI 兼容基地址（scheme://host:port/v1）。缺省用 AG_MOCK_BASE_URL 的 default（chart 内置 mock-llm）。"
  - name: model_name
    type: string
    required: false
    description: "服务端模型名（OpenAI 兼容接口 model 字段取值）；缺省 mock-llm。"
  - name: model_path
    type: string
    required: false
    description: "容器内模型权重路径；mock 服务无权重，一般不填。"
  - name: ready_timeout_seconds
    type: integer
    required: false
    description: "就绪探测总窗口（秒），缺省 120；超窗 DEPLOY_BLOCKED(reason=timeout)。"

# 与 input_format 同格式的合法片段（§5.4），UI 输入框占位。空行 = 全缺省接入内置 mock-llm。
placeholder: |
  {"base_url":"http://mock-llm.argus.svc.cluster.local:18080/v1","model_name":"mock-llm"}
  base_url / model_name 都可省略：省略 = 接入 chart 内置 mock-llm（联调缺省）；
  ready_timeout_seconds 缺省 120。就绪探测打 {base_url}/models，2xx 即就绪。

# 运行期读取的环境变量（§12.4）。这里是声明，不是绑定：值由平台注入
# （Task 级 env > 上游 exports > 本声明 default）。
env:
  AG_MOCK_BASE_URL:
    required: false
    secret: false
    default: "http://mock-llm.argus.svc.cluster.local:18080/v1"
    description: "mock 服务（OpenAI 兼容）基地址缺省值。chart 内置 mock-llm 的集群内 DNS；接别的服务时用 Task env 或 base_url 参数覆盖。"
  AG_MOCK_READY_TIMEOUT:
    required: false
    secret: false
    default: "120"
    description: "就绪探测总窗口（秒）缺省值；参数 ready_timeout_seconds 优先。"
  AG_MOCK_POLL_INTERVAL:
    required: false
    secret: false
    description: "就绪探测间隔（秒），缺省 2。"
